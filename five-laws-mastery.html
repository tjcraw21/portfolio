/* ============================================================
   PART 2 — STATE, PERSISTENCE, MASTERY MODEL
   ============================================================ */
const STORE_KEY = "flm_state_v1";
const DEMO_KINDS = ["recall","recognition","application","explanation"];
const CAT_TO_DEMO = {recall:"recall",example:"recognition",misconception:"recognition",
  connection:"application",scenario:"application",critical:"explanation",teach:"explanation"};

function blankConcept(){return{att:0,cor:0,inc:0,confSum:0,confN:0,
  demos:{recall:0,recognition:0,application:0,explanation:0},last:0,read:false,flag:false};}

function blankState(){
  const c={}; CONCEPTS.forEach(x=>c[x.id]=blankConcept());
  return {v:1,xp:0,streak:0,bestStreak:0,onboarded:false,plan:null,familiarity:null,theme:"auto",
    concepts:c,qs:{},lessons:{},convo:{},devils:{},teach:{},
    exam:null,boss:{stage:0,cleared:false},rapidBest:0,session:null,started:Date.now(),minutes:0};
}

let S = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return blankState();
    const p = JSON.parse(raw);
    const base = blankState();
    const merged = Object.assign(base,p);
    // repair: ensure every concept exists (content may have grown)
    merged.concepts = merged.concepts||{};
    CONCEPTS.forEach(x=>{
      const cur = merged.concepts[x.id];
      merged.concepts[x.id] = Object.assign(blankConcept(),cur||{});
      merged.concepts[x.id].demos = Object.assign({recall:0,recognition:0,application:0,explanation:0},(cur&&cur.demos)||{});
    });
    ["qs","lessons","convo","devils","teach"].forEach(k=>{ if(typeof merged[k]!=="object"||!merged[k]) merged[k]={}; });
    if(!merged.boss) merged.boss={stage:0,cleared:false};
    return merged;
  }catch(e){ console.warn("state load failed, starting fresh",e); return blankState(); }
}
let saveTimer=null;
function writeState(){ try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){} }
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(writeState,120); }
/* never let a debounced write be lost when the tab is closed, hidden or reloaded */
function flushSave(){ clearTimeout(saveTimer); writeState(); }
window.addEventListener("pagehide",flushSave);
window.addEventListener("beforeunload",flushSave);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushSave(); });

/* ---- mastery maths ---- */
function conceptMastery(id){
  const st=S.concepts[id]; if(!st) return 0;
  if(st.att===0) return st.read?8:0;
  const acc = st.cor/st.att;                                  // demonstrated accuracy
  const volume = Math.min(1, st.cor/4);                       // repeated success
  const breadth = DEMO_KINDS.filter(k=>st.demos[k]>0).length/4; // across question kinds
  let m = 100*(0.45*acc + 0.30*volume + 0.25*breadth);
  // confidence adjustment: correct-but-guessed shouldn't read as mastered
  if(st.confN){
    const avg = st.confSum/st.confN;            // 1..5
    const f = 0.82 + 0.045*Math.min(5,Math.max(1,avg)); // 0.865 .. 1.045
    m *= Math.min(1.02,f);
  }
  if(st.read) m = Math.max(m, 10);
  if(st.flag) m = Math.min(m, 62);              // high-confidence error: cap until re-proven
  return Math.max(0,Math.min(100,Math.round(m)));
}
function topicMastery(topic){
  const list=CONCEPTS.filter(c=>c.topic===topic);
  if(!list.length) return 0;
  let w=0,s=0; list.forEach(c=>{w+=c.importance; s+=c.importance*conceptMastery(c.id);});
  return Math.round(s/w);
}
function overallMastery(){
  let w=0,s=0; CONCEPTS.forEach(c=>{w+=c.importance; s+=c.importance*conceptMastery(c.id);});
  const core = s/w;
  return Math.round(core*0.82 + conversationReadiness()*0.18);
}
function conversationReadiness(){
  const convoSeen=Object.keys(S.convo).length, devilSeen=Object.keys(S.devils).length;
  const teachScores=Object.values(S.teach);
  const teachAvg = teachScores.length? teachScores.reduce((a,b)=>a+b,0)/teachScores.length : 0;
  const cov = Math.min(1, convoSeen/18)*35 + Math.min(1, devilSeen/6)*15 + Math.min(1,teachScores.length/6)*10;
  const quality = teachAvg*0.25;                       // teachAvg is 0..100
  const conn = topicMastery("conn")*0.15;
  return Math.round(Math.min(100, cov + quality + conn));
}
function readinessBand(p){
  if(p<60) return {label:"Not ready yet",cls:"bad",note:"Keep drilling — you need demonstrated recall before this holds up in conversation."};
  if(p<75) return {label:"Basic understanding",cls:"warn",note:"You can follow the material. You'd struggle with follow-up questions."};
  if(p<85) return {label:"Conversation ready",cls:"brand",note:"You can hold a natural discussion and answer most follow-ups."};
  if(p<95) return {label:"Strong command",cls:"good",note:"You can compare, apply and defend the ideas under pressure."};
  return {label:"Could teach it",cls:"good",note:"You can teach the framework, critique it, and handle unexpected angles."};
}
function weakConcepts(n){
  return CONCEPTS.map(c=>({c,m:conceptMastery(c.id),st:S.concepts[c.id]}))
    .filter(x=>x.m<75)
    .sort((a,b)=>(a.m-b.m)||(b.c.importance-a.c.importance))
    .slice(0,n||6);
}
function masteredCount(){ return CONCEPTS.filter(c=>conceptMastery(c.id)>=80).length; }

/* ---- recording answers (the adaptive core) ----
   Every graded interaction updates: attempt counts, the demonstration kind,
   XP/streak, and the concept's confidence profile. Confidence is used two ways:
   a correct-but-guessed answer is discounted, and a confident wrong answer
   flags the concept as a live misconception so it resurfaces sooner.        */
function record(conceptId, correct, cat, qid){
  const st=S.concepts[conceptId]; if(!st) return;
  st.att++; st.last=Date.now();
  if(correct){ st.cor++; const k=CAT_TO_DEMO[cat]||"recall"; st.demos[k]=(st.demos[k]||0)+1; }
  else st.inc++;
  if(qid){ const q=S.qs[qid]||{n:0,ok:0,bad:0,last:0}; q.n++; correct?q.ok++:q.bad++; q.last=Date.now(); S.qs[qid]=q; }
  if(correct){ S.streak++; S.bestStreak=Math.max(S.bestStreak,S.streak); S.xp += 10 + Math.min(15,S.streak); }
  else { S.streak=0; S.xp+=2; }
  save();
}
function recordConfidence(conceptId, correct, level){
  const st=S.concepts[conceptId]; if(!st) return;
  st.confSum+=level; st.confN++;
  if(!correct && level>=4) st.flag=true;        // confident and wrong => prioritised misconception
  if(correct && level>=4 && st.flag && st.cor>=3) st.flag=false; // re-proven
  save();
}

/* ---- adaptive question selection ----
   Weight rises when: concept mastery is low, the concept is flagged, the
   specific question was previously missed, or it has not been seen recently.
   Weight falls for questions answered correctly more than once.            */
function questionWeight(q, recentIds){
  if(recentIds && recentIds.includes(q.id)) return 0;
  const m = conceptMastery(q.c);
  const st = S.concepts[q.c]||blankConcept();
  let w = 1 + (100-m)/25;                      // 1 .. 5
  if(st.flag) w *= 1.8;
  const h = S.qs[q.id];
  if(h){
    if(h.bad>h.ok) w *= 2.2;
    if(h.ok>=1) w *= 0.55;
    if(h.ok>=3) w *= 0.4;
    const hrs=(Date.now()-h.last)/36e5;
    if(hrs<0.25) w *= 0.35;                    // just asked
  } else w *= 1.35;                            // unseen questions get a nudge
  const imp = (CONCEPT_BY_ID[q.c]||{importance:3}).importance;
  return Math.max(0.05, w * (0.7 + imp*0.12));
}
function pickQuestions(pool, count, opts){
  opts=opts||{};
  const recent=[]; const out=[];
  const avail=pool.slice();
  while(out.length<count && avail.length){
    const weights=avail.map(q=>questionWeight(q,recent));
    const total=weights.reduce((a,b)=>a+b,0);
    if(total<=0){ out.push(avail.shift()); continue; }
    let r=Math.random()*total, idx=0;
    for(let i=0;i<avail.length;i++){ r-=weights[i]; if(r<=0){ idx=i; break; } }
    const q=avail.splice(idx,1)[0];
    out.push(q); recent.push(q.id);
    if(opts.oneEachConcept){ for(let i=avail.length-1;i>=0;i--) if(avail[i].c===q.c) avail.splice(i,1); }
  }
  return out;
}
function poolBy(filter){ return QUESTIONS.filter(filter); }

/* ---- misc helpers ---- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function norm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2100);}
function pct(n){return Math.max(0,Math.min(100,Math.round(n)));}

/* ============================================================
   PART 3 — QUIZ ENGINE (handles every question type)
   ============================================================ */
let QZ=null;
function startQuiz(cfg){
  QZ=Object.assign({title:"Practice",sub:"",items:[],exam:false,confEvery:3,back:"dash",onDone:null},cfg);
  QZ.i=0; QZ.results=[]; QZ.phase="answer"; QZ.sel=null; QZ.view=null;
  if(!QZ.items.length){ toast("No questions available"); return go(QZ.back); }
  VIEW="quiz"; renderTabs();
  renderQuiz();
}
function quizItem(){ return QZ.items[QZ.i]; }

/* prepare a per-item view model (shuffling once, so re-renders stay stable) */
function buildView(q){
  if(q.t==="mc"||q.t==="tf"){
    const idx=shuffle(q.o.map((_,i)=>i));
    return {opts:idx.map(i=>q.o[i]), correct:idx.indexOf(q.a)};
  }
  if(q.t==="order"){
    let sh=shuffle(q.items);
    if(sh.join("|")===q.items.join("|")) sh=shuffle(sh);
    return {list:sh};
  }
  if(q.t==="match"){
    return {left:shuffle(q.pairs.map((p,i)=>({i,t:p[0]}))),right:shuffle(q.pairs.map((p,i)=>({i,t:p[1]}))),
      done:{},selLeft:null,errs:0};
  }
  return {};
}

function renderQuiz(){
  const q=quizItem();
  if(!QZ.view) QZ.view=buildView(q);
  const n=QZ.items.length, prog=Math.round((QZ.i/n)*100);
  const c=CONCEPT_BY_ID[q.c];
  const catLabel={recall:"Recall",example:"Example",scenario:"Scenario",connection:"Connection",misconception:"Misconception",critical:"Critical"}[q.cat]||"Practice";
  let body="";
  if(q.t==="mc"||q.t==="tf"){
    body=`<div class="choices" role="group" aria-label="Answer options">${QZ.view.opts.map((o,i)=>
      `<button class="choice" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  } else if(q.t==="fill"){
    body=`<div class="mt"><label for="fillIn">Type your answer</label>
      <input type="text" id="fillIn" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="One or two words…">
      <button class="btn block mt" id="fillGo">Check answer</button></div>`;
  } else if(q.t==="order"){
    body=`<div class="order-list" id="ordList">${QZ.view.list.map((t,i)=>
      `<div class="ord" data-i="${i}"><span class="num">${i+1}</span><span class="txt">${esc(t)}</span>
        <span class="mv"><button data-mv="up" data-i="${i}" aria-label="Move up">▲</button><button data-mv="down" data-i="${i}" aria-label="Move down">▼</button></span></div>`).join("")}</div>
      <button class="btn block" id="ordGo">Check order</button>`;
  } else if(q.t==="match"){
    body=`<p class="small muted">Tap an item on the left, then its match on the right.</p>
      <div class="grid two mt-s">
        <div class="match-grid" id="mLeft">${QZ.view.left.map(o=>`<button class="mitem" data-side="l" data-i="${o.i}">${esc(o.t)}</button>`).join("")}</div>
        <div class="match-grid" id="mRight">${QZ.view.right.map(o=>`<button class="mitem" data-side="r" data-i="${o.i}">${esc(o.t)}</button>`).join("")}</div>
      </div>`;
  }
  $("#main").innerHTML=`
    <div class="spread mb">
      <button class="btn ghost sm" id="qBack">← Exit</button>
      <span class="pill">${QZ.i+1} / ${n}</span>
    </div>
    <div class="bar mb"><i style="width:${prog}%"></i></div>
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <span class="pill brand">${catLabel}</span>
        <span class="pill">${esc(c?c.name:"")}</span>
        ${QZ.exam?'<span class="pill warn">Exam — answers at the end</span>':""}
      </div>
      <h2 style="font-size:clamp(1.05rem,1rem+.5vw,1.3rem)">${esc(q.q)}</h2>
      ${body}
      <div id="fb"></div>
    </div>
    <p class="tiny muted center mt">Streak ${S.streak} · ${S.xp} XP</p>`;
  $("#qBack").onclick=()=>{ if(confirm("Exit this set? Progress on answered questions is saved.")) go(QZ.back); };
  wireQuiz(q);
  updateRail();
  $("#main").focus({preventScroll:true});
}

function wireQuiz(q){
  if(q.t==="mc"||q.t==="tf"){
    $$("#main .choice").forEach(b=>b.onclick=()=>submitAnswer(parseInt(b.dataset.i,10)===QZ.view.correct,b));
  } else if(q.t==="fill"){
    const go=()=>{
      const val=norm($("#fillIn").value);
      if(!val){ toast("Type an answer first"); return; }
      const ok=q.a.some(a=>{const n=norm(a); return val===n||val.includes(n)||n.includes(val)&&val.length>2;});
      submitAnswer(ok);
    };
    $("#fillGo").onclick=go;
    $("#fillIn").onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();go();} };
    setTimeout(()=>{try{$("#fillIn").focus();}catch(e){}},60);
  } else if(q.t==="order"){
    const redraw=()=>{
      const rows=$$("#ordList .ord");
      rows.forEach((r,i)=>{ r.dataset.i=i; $(".num",r).textContent=i+1;
        $$("button",r).forEach(b=>b.dataset.i=i); });
    };
    $("#ordList").onclick=e=>{
      const b=e.target.closest("button[data-mv]"); if(!b) return;
      const i=parseInt(b.dataset.i,10), dir=b.dataset.mv==="up"?-1:1, j=i+dir;
      if(j<0||j>=QZ.view.list.length) return;
      const l=QZ.view.list; [l[i],l[j]]=[l[j],l[i]];
      const list=$("#ordList"), rows=$$("#ordList .ord");
      dir===-1?list.insertBefore(rows[i],rows[j]):list.insertBefore(rows[j],rows[i]);
      redraw();
    };
    $("#ordGo").onclick=()=>{
      const ok=QZ.view.list.every((t,i)=>t===q.items[i]);
      $$("#ordList .ord").forEach((r,i)=>r.classList.add(QZ.view.list[i]===q.items[i]?"ok":"bad"));
      submitAnswer(ok);
    };
  } else if(q.t==="match"){
    const click=e=>{
      const b=e.target.closest(".mitem"); if(!b||b.classList.contains("done")) return;
      if(b.dataset.side==="l"){
        $$("#mLeft .mitem").forEach(x=>x.classList.remove("sel"));
        b.classList.add("sel"); QZ.view.selLeft=parseInt(b.dataset.i,10);
      } else {
        if(QZ.view.selLeft==null){ toast("Pick an item on the left first"); return; }
        const r=parseInt(b.dataset.i,10);
        if(r===QZ.view.selLeft){
          b.classList.add("done");
          const lb=$(`#mLeft .mitem[data-i="${r}"]`); lb.classList.remove("sel"); lb.classList.add("done");
          QZ.view.done[r]=true; QZ.view.selLeft=null;
          if(Object.keys(QZ.view.done).length===q.pairs.length) submitAnswer(QZ.view.errs===0);
        } else {
          QZ.view.errs++; b.classList.add("err"); setTimeout(()=>b.classList.remove("err"),320);
        }
      }
    };
    $("#mLeft").onclick=click; $("#mRight").onclick=click;
  }
}

function submitAnswer(correct,btn){
  const q=quizItem();
  if(QZ.phase!=="answer") return;
  QZ.phase="graded";
  record(q.c,correct,q.cat,q.id);
  QZ.results.push({q,correct});
  if(q.t==="mc"||q.t==="tf"){
    $$("#main .choice").forEach((b,i)=>{
      b.disabled=true;
      if(i===QZ.view.correct) b.classList.add("correct");
      else if(btn&&b===btn) b.classList.add("wrong");
    });
  }
  if(q.t==="fill"){ $("#fillGo").disabled=true; $("#fillIn").disabled=true; }
  if(q.t==="order") $("#ordGo").disabled=true;
  const needConf = !QZ.noConf && (QZ.exam || (QZ.i % QZ.confEvery === QZ.confEvery-1));
  if(needConf) askConfidence(correct); else showFeedback(correct);
}

function askConfidence(correct){
  const labels=[["1","guessed"],["2","unsure"],["3","fairly sure"],["4","confident"],["5","could teach it"]];
  $("#fb").innerHTML=`<div class="feedback" style="background:var(--bg-3);border-color:var(--line-2)">
      <h4>How confident were you?</h4>
      <div class="conf">${labels.map((l,i)=>`<button data-c="${i+1}"><b>${l[0]}</b><span>${l[1]}</span></button>`).join("")}</div>
    </div>`;
  $$("#fb .conf button").forEach(b=>b.onclick=()=>{
    recordConfidence(quizItem().c,correct,parseInt(b.dataset.c,10));
    showFeedback(correct);
  });
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function showFeedback(correct){
  const q=quizItem(), c=CONCEPT_BY_ID[q.c];
  if(QZ.exam){
    $("#fb").innerHTML=`<div class="feedback" style="background:var(--bg-3);border-color:var(--line-2)">
      <p><strong>Recorded.</strong> Answers and explanations are shown after you submit the exam.</p>
      <button class="btn block mt-s" id="nextQ">Next question →</button></div>`;
  } else {
    const answerTxt = q.t==="fill" ? q.a[0] : (q.t==="order"? q.items.join(" → ") : (q.t==="match"? "" : q.o[q.a]));
    $("#fb").innerHTML=`<div class="feedback ${correct?"ok":"no"}">
      <h4>${correct?"Correct":"Not quite"}</h4>
      ${(!correct&&answerTxt)?`<p><strong>Answer:</strong> ${esc(answerTxt)}</p>`:""}
      <p>${esc(q.why)}</p>
      ${!correct&&c?`<p class="small"><strong>Quick refresher — ${esc(c.name)}:</strong> ${esc(c.definition)}</p>
        <p class="small"><em>Hook:</em> ${esc(c.hook)}</p>`:""}
      <button class="btn block mt-s" id="nextQ">${QZ.i+1<QZ.items.length?"Next question →":"See results →"}</button>
    </div>`;
  }
  $("#nextQ").onclick=nextQuestion;
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
  updateRail();
}

function nextQuestion(){
  QZ.i++; QZ.phase="answer"; QZ.view=null;
  if(QZ.i>=QZ.items.length) return finishQuiz();
  renderQuiz();
}

function finishQuiz(){
  const res=QZ.results, right=res.filter(r=>r.correct).length, n=res.length;
  const score=n?Math.round(right/n*100):0;
  if(QZ.onDone) return QZ.onDone(res,score);
  const missed=res.filter(r=>!r.correct);
  const byC={}; res.forEach(r=>{const k=r.q.c; byC[k]=byC[k]||{n:0,ok:0}; byC[k].n++; if(r.correct)byC[k].ok++;});
  $("#main").innerHTML=`
    <div class="sec-head"><div class="ico">${ICON.trophy}</div><div><h1>Set complete</h1><p>${right} of ${n} correct</p></div></div>
    <div class="card center">
      <div class="ring" style="--p:${score};margin:0 auto"><div class="val"><b>${score}%</b><span>this set</span></div></div>
      <p class="mt small muted">Overall mastery is now <strong>${overallMastery()}%</strong> · streak ${S.streak}</p>
    </div>
    ${missed.length?`<div class="card"><h3>Review what you missed</h3>
      ${missed.map(r=>`<details class="acc"><summary>${esc(r.q.q.slice(0,95))}${r.q.q.length>95?"…":""}</summary>
        <div><p><strong>Answer:</strong> ${esc(r.q.t==="fill"?r.q.a[0]:(r.q.t==="order"?r.q.items.join(" → "):(r.q.t==="match"?"See the matching pairs in the lesson":r.q.o[r.q.a])))}</p><p>${esc(r.q.why)}</p></div></details>`).join("")}
      </div>`:`<div class="card center"><h3>Clean sweep</h3><p class="muted small">Nothing missed in this set.</p></div>`}
    <div class="grid two mt">
      <button class="btn" id="again">Another set</button>
      <button class="btn ghost" id="home">Back to dashboard</button>
    </div>`;
  $("#again").onclick=()=>startQuiz(Object.assign({},QZ,{items:pickQuestions(QZ.pool||QUESTIONS,QZ.items.length),i:0,results:[]}));
  $("#home").onclick=()=>go(QZ.back||"dash");
  updateRail(); sessionAdvance();
}

function launchStep(s){
  const a=s.act;

    const pool=poolBy(a.quiz.filter);
    startQuiz({title:a.quiz.title,items:pickQuestions(pool,Math.min(a.quiz.n,pool.length)),pool,back:"dash",markKey:s.key});
  } else if(a.v==="lessons"){ go("lessons",{ids:a.ids,stepKey:s.key}); }
  else { pendingStepKey=a.v==="map"||a.v==="cheat"||a.v==="memory"?s.key:s.key; go(a.v,{stepKey:s.key}); }
}

/* ---------- TEACH-BACK (structured self-assessment) ----------
   This is keyword and idea matching, not semantic AI grading. It checks
   whether the ideas an ideal answer must contain actually appear in yours. */
const MISREADS=[
 {k:["work for free","working for free","free labour","free labor"],note:"“Working for free” — the document explicitly says the Law of Value is not about sacrificing yourself or working for free."},
 {k:["lower your price","lower the price","cut your price","charge less","discount"],note:"Equating value with discounting — price and value are different dimensions in the document."},
 {k:["influence comes from authority","influence is authority","because of their title"],note:"Tying influence to authority — the document separates the two explicitly."},
 {k:["leverage means technology","leverage requires technology","only tech","must be digital"],note:"Restricting leverage to technology — Starbucks is the document's non-tech leverage case."},
 {k:["receptivity is about greed","taking what you can","take more than"],note:"Reading receptivity as greed — the document defines it as readiness."},
 {k:["manufacturing is bad","manufacturing is obsolete","manufacturing models are useless"],note:"Dismissing manufacturing models — the document credits them with resilience, reliability and building the modern economy."}
];
const NEGATORS=["not ","isn't","is not","doesn't","does not","never","rather than","instead of","without","no ","don't"];
function gradeTeach(item,text){
  const t=norm(text), words=t.split(" ").filter(Boolean).length;
  const hit=g=>g.keys.some(k=>t.includes(norm(k)));
  const req=item.required.map(g=>({g,ok:hit(g)}));
  const opt=item.optional.map(g=>({g,ok:hit(g)}));
  const reqOk=req.filter(r=>r.ok).length, optOk=opt.filter(r=>r.ok).length;
  const lenFactor=Math.min(1,words/45);
  let score=Math.round(58*(reqOk/req.length) + 24*(optOk/Math.max(1,opt.length)) + 18*lenFactor);
  if(words<12) score=Math.min(score,25);
  const flags=[];
  MISREADS.forEach(m=>m.k.forEach(k=>{
    const idx=t.indexOf(norm(k));
    if(idx>=0){
      const pre=t.slice(Math.max(0,idx-45),idx);
      if(!NEGATORS.some(n=>pre.includes(n))) if(!flags.includes(m.note)) flags.push(m.note);
    }
  }));
  return {score:Math.max(0,Math.min(100,score)),req,opt,flags,words};
}

function rfStart(stepKey){
  const order=shuffle(RAPID.map((_,i)=>i)).slice(0,20);
  RF={order,i:0,correct:0,times:[],streak:0,best:0,wrong:[],stepKey};
  rfRender();
}
function rfRender(){
  if(!RF) return;
  if(RF.i>=RF.order.length) return rfEnd();
  const idx=RF.order[RF.i], item=RAPID[idx];
  const opts=shuffle(item.o.map((_,i)=>i));
  const correct=opts.indexOf(item.a);
  RF.t0=Date.now(); RF.answered=false;
  $("#main").innerHTML=`
    <div class="spread mb"><span class="pill">${RF.i+1} / ${RF.order.length}</span>
      <span class="combo">${RF.streak>1?"🔥 "+RF.streak+" streak":"&nbsp;"}</span>
      <button class="btn ghost sm" id="rfQuit">Stop</button></div>
    <div class="rf-timer"><i id="rfBar" style="width:100%"></i></div>
    <div class="card">
      <h2 style="font-size:clamp(1.15rem,1rem+1vw,1.5rem)">${esc(item.q)}</h2>
      <div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${esc(item.o[o])}</span></button>`).join("")}</div>
      <div id="rfFb"></div>
    </div>`;
  $("#rfQuit").onclick=()=>{clearInterval(RF.timer);rfEnd();};
  const dur=10000; const start=Date.now();
  clearInterval(RF.timer);
  RF.timer=setInterval(()=>{
    const left=Math.max(0,dur-(Date.now()-start));
    const bar=$("#rfBar"); if(!bar){clearInterval(RF.timer);return;}
    bar.style.width=(left/dur*100)+"%";
    if(left<=0){ clearInterval(RF.timer); rfAnswer(false,null,correct,idx); }
  },100);
  $$("#main .choice").forEach(b=>b.onclick=()=>{
    if(RF.answered) return;
    clearInterval(RF.timer);
    rfAnswer(parseInt(b.dataset.i,10)===correct,b,correct,idx);
  });
}
function rfAnswer(ok,btn,correctIdx,itemIdx){
  if(!RF||RF.answered) return;
  RF.answered=true;
  RF.times.push(Date.now()-RF.t0);
  const cid=RAPID_C[itemIdx];
  if(cid) record(cid,ok,"recall","rf-"+itemIdx);
  if(ok){ RF.correct++; RF.streak++; RF.best=Math.max(RF.best,RF.streak); }
  else { RF.streak=0; RF.wrong.push(itemIdx); }
  $$("#main .choice").forEach((b,i)=>{ b.disabled=true;
    if(i===correctIdx) b.classList.add("correct");
    else if(btn&&b===btn) b.classList.add("wrong"); });
  $("#rfFb").innerHTML=`<p class="small ${ok?"":"muted"}" style="margin:10px 0 0">${ok?"✓ Correct":"✗ "+esc(RAPID[itemIdx].o[RAPID[itemIdx].a])}</p>`;
  setTimeout(()=>{ RF.i++; rfRender(); }, ok?450:1250);
}
function rfEnd(){
  if(!RF) return;
  clearInterval(RF.timer);
  const n=RF.times.length||1, avg=(RF.times.reduce((a,b)=>a+b,0)/n/1000).toFixed(1);
  S.rapidBest=Math.max(S.rapidBest,RF.correct); save();
  const weakNames=[...new Set(RF.wrong.map(i=>RAPID_C[i]))].map(id=>CONCEPT_BY_ID[id]?CONCEPT_BY_ID[id].name:id);
  $("#main").innerHTML=`
    <div class="sec-head"><div class="ico">${ICON.bolt}</div><div><h1>Rapid fire complete</h1><p>${RF.correct} of ${RF.order.length} correct</p></div></div>
    <div class="grid three">
      <div class="stat"><b>${Math.round(RF.correct/RF.order.length*100)}%</b><span>Accuracy</span></div>
      <div class="stat"><b>${avg}s</b><span>Avg response</span></div>
      <div class="stat"><b>${RF.best}</b><span>Best streak</span></div>
    </div>
    ${weakNames.length?`<div class="card mt"><h3>Concepts that slowed you down</h3><p class="small">${esc(weakNames.join(" · "))}</p>
      <button class="btn block mt-s" id="rfDrill">Drill these now</button></div>`:`<div class="card mt center"><h3>Clean run</h3><p class="small muted">Nothing missed.</p></div>`}
    <div class="grid two mt">
      <button class="btn" id="rfAgain">Go again</button>
      <button class="btn ghost" id="rfHome">Dashboard</button>
    </div>`;
  const ids=[...new Set(RF.wrong.map(i=>RAPID_C[i]))];
  if(weakNames.length) $("#rfDrill").onclick=()=>{
    const pool=QUESTIONS.filter(q=>ids.includes(q.c));
    startQuiz({title:"Rapid-fire weak spots",items:pickQuestions(pool,Math.min(8,pool.length)),pool,back:"rapid"});
  };
  $("#rfAgain").onclick=()=>rfStart(RF.stepKey);
  $("#rfHome").onclick=()=>{ if(RF.stepKey) markStep(RF.stepKey); go("dash"); };
  if(RF.stepKey) markStep(RF.stepKey);
  updateRail();
};

function buildExam(n){
  const mix=[["recall",.36],["scenario",.20],["example",.16],["connection",.14],["misconception",.08],["critical",.06]];
  let items=[];
  mix.forEach(([cat,share])=>{
    const pool=poolBy(q=>q.cat===cat);
    const k=Math.min(pool.length,Math.max(1,Math.round(n*share)));
    items=items.concat(pickQuestions(pool,k));
  });
  // top up / trim to exactly n
  if(items.length<n){
    const used=items.map(i=>i.id);
    const rest=QUESTIONS.filter(q=>!used.includes(q.id));
    items=items.concat(pickQuestions(rest,n-items.length));
  }
  return shuffle(items).slice(0,n);
}

function bossRun(st,stepKey){
  const s=BOSS_STAGES[st];
  if(s.kind==="quiz"){
    const pool=poolBy(s.filter);
    startQuiz({title:"Boss — "+s.n,items:pickQuestions(pool,Math.min(s.count,pool.length)),pool,back:"boss",noConf:true,
      onDone:(res)=>{
        const right=res.filter(r=>r.correct).length, pass=right>=s.pass;
        bossResult(st,pass,`${right} of ${res.length} correct — you needed ${s.pass}.`,res.filter(r=>!r.correct),stepKey);
      }});
  } else {
    const it=TEACHBACK.find(t=>t.id===s.ref)||TEACHBACK[0];
    $("#main").innerHTML=`
      <div class="card">
        <span class="pill bad">Boss stage ${st+1} — ${esc(s.n)}</span>
        <h2 class="mt-s">${esc(it.prompt)}</h2>
        <textarea id="bossText" placeholder="No notes. Write it as you would say it."></textarea>
        <button class="btn block lg mt" id="bossSub">Submit answer</button>

      const txt=$("#bossText").value.trim();
      if(txt.split(/\s+/).filter(Boolean).length<15){ toast("Give it a proper answer — at least a few sentences"); return; }
      const r=gradeTeach(it,txt);
      S.teach[it.id]=Math.max(S.teach[it.id]||0,r.score);
      record(it.c,r.score>=65,"critical","boss-"+it.id); save();
      const missing=r.req.filter(x=>!x.ok).map(x=>x.g.label);
      bossResult(st,r.score>=65,`You covered ${r.score}% of the ideas a strong answer contains.`+(missing.length?" Missing: "+missing.join("; ")+".":""),[],stepKey,it);

  }
}

      ${teachItemRef?`<h3 class="mt">A model answer</h3><blockquote class="small">${esc(teachItemRef.ideal)}</blockquote>`:""}
      ${missed.length?`<h3 class="mt">What you missed</h3>${missed.map(r=>`<details class="acc"><summary>${esc(r.q.q.slice(0,85))}…</summary><div><p><strong>Answer:</strong> ${esc(r.q.t==="fill"?r.q.a[0]:(r.q.t==="order"?r.q.items.join(" → "):(r.q.t==="match"?"see lesson":r.q.o[r.q.a])))}</p><p>${esc(r.q.why)}</p></div></details>`).join("")}`:""}
      <button class="btn block lg mt" id="bNext">${pass?(st+1>=BOSS_STAGES.length?"Finish the battle →":"Next stage →"):"Retry this stage"}</button>
      <button class="btn ghost block mt-s" id="bOut">Leave the battle</button>
    </div>`;
  $("#bNext").onclick=()=>{ if(pass) go("boss",{stepKey}); else bossRun(st,stepKey); };
  $("#bOut").onclick=()=>go("dash");
  updateRail();
}

/* ---------- SETTINGS ---------- */
VIEWS.settings=function(){
  $("#main").innerHTML=`
    <div class="sec-head"><div class="ico">${ICON.shield}</div><div><h1>Settings</h1><p>Everything is stored locally in this browser only.</p></div></div>
    <div class="card">
      <h3 style="margin-top:0">Appearance</h3>
      <div class="row">${["auto","light","dark"].map(t=>`<button class="chip ${S.theme===t?"on":""}" data-th="${t}">${t}</button>`).join("")}</div>
      <h3 class="mt">Learning plan</h3>
      <div class="row">${Object.values(PLANS).map(p=>`<button class="chip ${S.plan===p.id?"on":""}" data-pl="${p.id}">${esc(p.name)}</button>`).join("")}</div>
      <h3 class="mt">Progress</h3>
      <p class="small muted">Mastery ${overallMastery()}% · ${S.xp} XP · ${Object.keys(S.qs).length} distinct questions attempted · best streak ${S.bestStreak}.</p>
      <button class="btn ghost block mt-s" id="rerun">Re-run the first-run setup</button>
      <h3 class="mt">Reset</h3>
      <p class="small muted">This erases all mastery, streaks, teach-back scores and plan progress. It cannot be undone.</p>
      <button class="btn danger block" id="reset">Reset all progress</button>
    </div>
    <button class="btn ghost block mt" id="back">← Dashboard</button>`;
  $$("[data-th]").forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;applyTheme();save();go("settings");});
  $$("[data-pl]").forEach(b=>b.onclick=()=>{S.plan=b.dataset.pl;save();toast("Plan updated");go("settings");});
  $("#rerun").onclick=()=>{ S.onboarded=false; save(); go("onboard"); };
  $("#back").onclick=()=>go("dash");
  $("#reset").onclick=()=>confirmReset();
};
function confirmReset(){
  $("#modalHost").innerHTML=`<div class="modal-bg" role="dialog" aria-modal="true" aria-label="Confirm reset">
    <div class="modal">
      <h3 style="margin-top:0">Erase all progress?</h3>
      <p class="small">Type <strong>RESET</strong> below to confirm. Everything — mastery, streaks, exam history, teach-back scores — will be deleted.</p>
      <input type="text" id="resetIn" autocomplete="off" placeholder="Type RESET">
      <div class="grid two mt">
        <button class="btn danger" id="doReset" disabled>Erase everything</button>
        <button class="btn ghost" id="cancelReset">Cancel</button>
      </div>
    </div></div>`;
  const inp=$("#resetIn");
  inp.oninput=()=>$("#doReset").disabled=inp.value.trim().toUpperCase()!=="RESET";
  $("#cancelReset").onclick=()=>$("#modalHost").innerHTML="";
  $("#doReset").onclick=()=>{
    try{localStorage.removeItem(STORE_KEY);}catch(e){}
    S=blankState(); save(); $("#modalHost").innerHTML=""; applyTheme(); toast("Progress reset"); go("onboard");
  };
  setTimeout(()=>{try{inp.focus();}catch(e){}},80);
}

/* ---------- BOOT ---------- */
applyTheme();
renderTabs();
go(S.onboarded?"dash":"onboard");
window.addEventListener("keydown",e=>{
  if(e.target&&/input|textarea/i.test(e.target.tagName)) return;
  const btns=$$("#main .choice:not([disabled])");
  if(btns.length&&/^[1-4]$/.test(e.key)){ const b=btns[parseInt(e.key,10)-1]; if(b){e.preventDefault();b.click();} }
  if(e.key==="Enter"){ const n=$("#nextQ"); if(n){e.preventDefault();n.click();} }
});
</script>
