 o:["The educator, a parent who was a software developer, and a local businesswoman experienced in marketing","The educator, a venture capitalist, and a school principal","The educator, her husband, and a game designer","Two teachers and an investor"],a:0,
 why:"She shared the idea with a parent who was a software developer; they then brought in a local businesswoman experienced in marketing."},
{id:"e12",c:"ex-teacher",cat:"example",t:"mc",q:"How did seed capital reach the educator's startup?",
 o:["Through a mutual acquaintance known for connecting the right people at the right time","Through a government innovation grant","Through an accelerator programme","Through the software developer's personal savings"],a:0,
 why:"“Seed capital came through a mutual acquaintance—a person known for connecting the right people at the right time.” A quiet illustration of the Law of Influence."},
{id:"e13",c:"ex-teacher",cat:"example",t:"mc",q:"What annual figure does the document give for the educator's company?",
 o:["Over $200 million in annual sales","Over $20 million in annual sales","Over $500 million in annual sales","Over $1 billion in annual sales"],a:0,
 why:"“The company eventually reached over $200 million in annual sales.”"},
{id:"e14",c:"ex-teacher",cat:"example",t:"mc",q:"In the Law of Authenticity, what does the document say became the founder's competitive edge?",
 o:["Her sincerity — she remained a teacher with a deep love for children and learning","Her technical fluency, gained on the job","Her marketing partner's expertise","Her first-mover advantage in edtech"],a:0,
 why:"“The founder never pretended to be a tech mogul or sales expert… Her sincerity became her competitive edge.”"},
{id:"e15",c:"ex-amazon",cat:"example",t:"mc",q:"On which two principles does the document say Bezos built Amazon?",
 o:["Relentless focus on the customer, and continuous expansion of reach","Lowest prices, and fastest delivery","Automation, and vertical integration","Scale first, profit later"],a:0,
 why:"Those two principles are listed directly under “Amazon's Customer Obsession at Scale.”"},
{id:"e16",c:"ex-amazon",cat:"example",t:"mc",q:"Which figures does the document give for Amazon?",
 o:["Among the first companies to surpass $500 billion in annual revenue; over 1.5 million employees globally","$1 trillion in annual revenue; 2 million employees","$250 billion in annual revenue; 900,000 employees","$500 billion market capitalisation; 1 million employees"],a:0,
 why:"“Amazon became one of the first companies in history to surpass $500 billion in annual revenue and employ over 1.5 million people globally.”"},
{id:"e17",c:"ex-amazon",cat:"example",t:"mc",q:"Which of these does the document list as Amazon's shift from manufacturing-style operations to leverage?",
 o:["Logistics networks, third-party sellers, automated recommendation systems and AWS","Acquisitions, advertising, and international expansion","Robotics, warehouses, and same-day delivery","Private label brands, subscriptions, and devices"],a:0,
 why:"Bezos shifted from holding inventory and shipping one order at a time to those four leverage mechanisms."},
{id:"e18",c:"ex-amazon",cat:"example",t:"mc",q:"How does the document summarise what Amazon does today?",
 o:["It doesn't just sell products; it runs a system that enables millions of others to sell, store and distribute at scale","It has become the world's largest logistics company","It has replaced retail with subscription services","It converts customer data into predictive demand"],a:0,
 why:"That sentence is the document's punchline for the Amazon leverage example."},
{id:"e19",c:"ex-netflix",cat:"example",t:"mc",q:"How does the document describe Blockbuster's model?",
 o:["Built on the manufacturing mindset: more stores meant more rentals, and more rentals meant more revenue","A leveraged model that failed on execution","A franchise system that scaled too slowly","A technology business that misread the market"],a:0,
 why:"“Their model scaled only by adding more physical locations and inventory—a linear growth path tied directly to resources and overhead.”"},
{id:"e20",c:"ex-netflix",cat:"example",t:"mc",q:"What second-stage leverage move does the document credit Netflix with, beyond streaming?",
 o:["Producing original shows — leveraged intellectual property that streams endlessly without additional cost per unit","Buying rival catalogues to lock up supply","Launching in multiple countries simultaneously","Personalised recommendations"],a:0,
 why:"“by producing original shows, they leveraged intellectual property—each film or series could be streamed endlessly without additional cost per unit.”"},
{id:"e21",c:"ex-starbucks",cat:"example",t:"mc",q:"What was Howard Schultz's vision, according to the document?",
 o:["Not just to serve coffee, but to create a system that delivered a consistent, valuable experience worldwide","To make premium coffee affordable to ordinary consumers","To replace the neighbourhood café with a global brand","To build the most efficient supply chain in the industry"],a:0,
 why:"By franchising and systematising operations, Starbucks turned a local café into a leveraged global brand."},
{id:"e22",c:"ex-starbucks",cat:"example",t:"mc",q:"How many Starbucks locations worldwide does the document cite?",
 o:["Over 38,000","Over 15,000","Over 50,000","Over 25,000"],a:0,
 why:"“scaling from a handful of stores to over 38,000 locations worldwide.”"},
{id:"e23",c:"ex-facebook",cat:"example",t:"mc",q:"What does the document say drove Facebook's expansion from a dormitory project to a global network connecting billions?",
 o:["The scalability of its system, not the addition of physical branches","Aggressive acquisition of competing networks","Advertising revenue reinvested into growth","Early access to university communities"],a:0,
 why:"“not through the addition of physical branches, but through the scalability of its system.”"},
{id:"e24",c:"ex-receptive",cat:"example",t:"mc",q:"Which four behaviours does the document list for the leader in the Law of Receptivity story?",
 o:["She refused offers of help, declined speaking opportunities, undercharged for her services, and avoided the spotlight","She overworked, refused delegation, ignored advice, and avoided investors","She gave discounts, worked weekends, skipped holidays, and mentored constantly","She turned down partnerships, avoided press, cut prices, and hired slowly"],a:0,
 why:"Those four refusals are listed exactly. Note that undercharging is treated as a failure to receive."},
{id:"e25",c:"ex-receptive",cat:"example",t:"mc",q:"What did the leader come to understand her refusal to receive was doing?",
 o:["Robbing others of the joy of giving — and robbing her of the success that naturally followed service","Protecting her from obligations she couldn't meet","Signalling humility that clients respected","Slowing her growth but preserving her integrity"],a:0,
 why:"A close advisor pointed it out; once she said yes, her impact multiplied and she had more energy to give."},
{id:"e26",c:"ex-small",cat:"example",t:"mc",q:"Which pairing does the document use to show compensation scaling with reach?",
 o:["A physician who transforms a single life vs the founders of a pharmaceutical company who extend relief to millions","A nurse vs a hospital administrator","A local pharmacist vs a national chain","A researcher vs a clinician"],a:0,
 why:"“A physician may transform a single life with extraordinary care, but the founders of a pharmaceutical company, by extending similar relief to millions, will naturally achieve magnitudes more in both compensation and influence.”"},
{id:"e27",c:"ex-small",cat:"example",t:"mc",q:"How does the document say a schoolteacher can transform the same value into greater compensation?",
 o:["By multiplying impact through writing, speaking, training or developing tools","By moving into school administration","By teaching larger class sizes","By tutoring privately at higher rates"],a:0,
 why:"“A schoolteacher might not become wealthy simply from teaching a classroom of 25 students each year. But that same teacher, if they find a way to multiply their impact…”"},
{id:"e28",c:"ex-small",cat:"example",t:"mc",q:"Which three ways does the document say an individual can scale in the digital era?",
 o:["Publishing insights to millions on LinkedIn, delivering value through a scalable SaaS product, cultivating audiences across geographies","Franchising, licensing and consulting","Investing, partnering and acquiring","Speaking, writing and advising"],a:0,
 why:"“A single professional can publish insights to millions on LinkedIn, deliver value through a scalable SaaS product, or cultivate audiences across geographies with minimal incremental cost.”"},
{id:"e29",c:"ex-small",cat:"example",t:"mc",q:"In the $25 meal example, what does the document count as the value received?",
 o:["A warm atmosphere, memorable service, excellent food, and a sense of being appreciated","The meal itself, plus the convenience of location","Nutrition, taste, and speed of service","The meal, plus loyalty points and a discount voucher"],a:0,
 why:"“the customer receives far more than what they paid for—making the business not just successful, but indispensable.”"},
{id:"e30",c:"ex-small",cat:"example",t:"mc",q:"Which professionals does the document name as capped by the number of clients they can serve in a week?",
 o:["Doctors, lawyers and consultants","Accountants, architects and engineers","Teachers, nurses and social workers","Designers, writers and photographers"],a:0,
 why:"“Even the most skilled professionals—the doctors, lawyers, and consultants—often found themselves capped by the number of clients they could serve in a given week.”"},
{id:"e31",c:"ex-hotdog",cat:"example",t:"mc",q:"In the Law of Influence retelling, what details does the vendor remember about the children?",
 o:["Names, birthdays, favourite colours, cartoon characters, even their friends' names","Only their names and their orders","Their schools and their parents' occupations","Their birthdays and their allergies"],a:0,
 why:"Under the Law of Value the details listed are names, birthdays and favourite superheroes; under Influence, names, birthdays, favourite colours, cartoon characters and friends' names."},
{id:"e32",c:"ex-teacher",cat:"example",t:"mc",q:"What does the document say the three founders had, in place of a business plan and major funding?",
 o:["Clarity of purpose, trust in each other, and an authentic passion for helping children learn in joyful ways","A prototype, a pilot school, and a waiting list","Technical skill, market timing, and persistence","A mentor, a network, and a brand"],a:0,
 why:"“They had no business plan, no major funding—just an idea and a shared belief in its potential.”"},

/* ===== SCENARIOS / APPLICATION ===== */
{id:"s01",c:"manufacturing",cat:"scenario",t:"mc",q:"A consultant is highly skilled but can only work with five clients at a time. Which idea from the document most directly explains the limitation?",
 o:["She is operating a manufacturing model — income tied directly to her effort and hours, so the ceiling is near","She is violating the Law of Authenticity by not showing up as herself","She has failed the Law of Receptivity by refusing new work","She is pursuing horizontal rather than vertical growth"],a:0,
 why:"The document names consultants explicitly among “the most skilled professionals… capped by the number of clients they could serve in a given week.”"},
{id:"s02",c:"leveraging",cat:"scenario",t:"mc",q:"That same consultant wants to break her ceiling. Which move best matches the document's definition of leverage?",
 o:["Package her methodology into a course or system that delivers her value without her personally attending each engagement","Raise her hourly rate by 40% and work with premium clients only","Hire four junior consultants and take a margin on their billable hours","Reduce her scope so she can take on eight shorter engagements"],a:0,
 why:"Leverage multiplies impact without demanding equal increases in effort. The document's parallel case: a teacher limited to one classroom reaching students globally through an online course. Raising rates and hiring more billable staff still tie output to input."},
{id:"s03",c:"law-compensation",cat:"scenario",t:"mc",q:"A SaaS founder serves 400,000 users but support is slow, bugs are frequent, and churn is high. Which law is she satisfying only half of?",
 o:["The Law of Compensation — she has reach but not the quality term of “how well you serve them”","The Law of Value — she is taking more in payment than she gives","The Law of Influence — she has not put customers' interests first","The Law of Receptivity — she is not open to feedback"],a:0,
 why:"Compensation is “the number of lives touched, multiplied by the quality of service delivered.” Scale without excellence only fills one of the two terms."},
{id:"s04",c:"law-value",cat:"scenario",t:"mc",q:"A restaurant charges the market rate but its staff learn regulars' names, remember dietary preferences and follow up after a bad experience. Which law is most directly demonstrated?",
 o:["The Law of Value — the guest receives far more than the price implies","The Law of Compensation — the restaurant is scaling service","The Law of Receptivity — the restaurant is open to feedback","The Law of Authenticity — the staff are being themselves"],a:0,
 why:"This mirrors the $25 meal and the hot dog vendor: value is what the customer receives and experiences, well beyond what they paid."},
{id:"s05",c:"leveraging",cat:"scenario",t:"mc",q:"A bakery owner opens her fourth identical shop, each one requiring her to hire, train and supervise personally. What kind of growth is this in the document's terms?",
 o:["Horizontal growth still operating on a manufacturing model — replication that requires proportional input","Vertical growth, because she has created new value","Leverage, because more locations serve more customers","Enlightenment, because her impact has broadened"],a:0,
 why:"Horizontal growth replicates existing models. It becomes leverage only when a system replicates the value without proportional owner effort — the Starbucks distinction."},
{id:"s06",c:"systems",cat:"scenario",t:"mc",q:"That same bakery owner documents every recipe, opening procedure and training routine so any manager can run a shop to standard. What has changed in the document's terms?",
 o:["She has built a system — value now replicates without her direct input, which is the Starbucks move","Nothing structural; she still owns physical shops, so it remains manufacturing","She has achieved vertical growth by inventing a new product category","She has satisfied the Law of Authenticity by making her standards explicit"],a:0,
 why:"“A small café owner can grow into a franchise brand through systems that replicate their value consistently.” Physical premises don't disqualify leverage — dependence on the owner does."},
{id:"s07",c:"law-influence",cat:"scenario",t:"mc",q:"A B2B salesperson opens every meeting by asking what the client is trying to achieve this quarter and regularly refers them to competitors when that's the better fit. What is being demonstrated?",
 o:["The Law of Influence — placing others' interests first builds the trust from which influence grows","The Law of Value — he is giving more than he takes","The Law of Authenticity — he is being himself","The Law of Receptivity — he is open to what comes back"],a:0,
 why:"Influence is “determined by how abundantly you place other people's interests first,” and it brings opportunities you didn't ask for."},
{id:"s08",c:"law-authenticity",cat:"scenario",t:"mc",q:"A first-time founder copies a famous CEO's speaking style, slide format and vocabulary for investor meetings. Which law is he violating?",
 o:["The Law of Authenticity — no amount of technique matches showing up as yourself, and no one else can be him","The Law of Value — he is taking more than he gives","The Law of Influence — he is putting himself first","The Law of Compensation — he is not serving enough people"],a:0,
 why:"The Fourth Law targets exactly this: polished personas, rehearsed pitches, mimicking others we admire."},
{id:"s09",c:"law-receptivity",cat:"scenario",t:"mc",q:"A freelance designer gives free strategy sessions to every prospect, discounts her invoices unprompted, and turns down a paid speaking slot as “not really my place.” Which law is she violating?",
 o:["The Law of Receptivity — she gives fluently but blocks the return flow, exactly like the leader in the document's story","The Law of Value — she is giving more than she takes, which is unsustainable","The Law of Authenticity — she is not being herself","The Law of Compensation — she is serving too few people"],a:0,
 why:"The document lists undercharging, declining speaking opportunities and avoiding the spotlight as symptoms of a refusal to receive."},
{id:"s10",c:"law-compensation",cat:"scenario",t:"mc",q:"A YouTube creator with 2 million subscribers earns far more than an equally talented private tutor. What does the document say explains this?",
 o:["Compensation mirrors impact — the creator serves vastly more people at comparable quality","Talent is unevenly rewarded and the market is arbitrary","The creator has better negotiating leverage with sponsors","The tutor has failed the Law of Value"],a:0,
 why:"“the professions or people who earn disproportionately high compensation usually impact disproportionately large numbers of people.” Compensation becomes a mirror of impact."},
{id:"s11",c:"values-guard",cat:"scenario",t:"mc",q:"A delivery startup triples in a year by burning capital, cutting corners on service quality, and treating partners as disposable. Then it collapses. Which of the document's claims does this illustrate?",
 o:["Enterprises that grow without a foundation of values expand rapidly but collapse with equal speed","Horizontal growth is always less durable than vertical growth","Compensation is a mirror of impact","Leverage always outpaces manufacturing models"],a:0,
 why:"“Technology, systems, and capital can create speed, but without values, speed produces volatility rather than resilience.”"},
{id:"s12",c:"price-value",cat:"scenario",t:"mc",q:"An e-commerce brand competes purely by being the cheapest, and is now being undercut. What would the document suggest is the deeper error?",
 o:["It has been competing on price when the First Law is about widening the gap between value delivered and payment taken","It should have grown horizontally into more categories first","It has violated the Law of Receptivity by refusing higher margins","It scaled before it had systems in place"],a:0,
 why:"Price is what the customer pays; value is what they receive and experience. Duolingo was free but the document insists the mechanism was value — “it wasn't just that it was free—it was fun.”"},
{id:"s13",c:"leveraging",cat:"scenario",t:"mc",q:"A university professor records her lecture series once and it is taken by 90,000 students over three years. Which document example is this closest to?",
 o:["The teacher once limited to a single classroom who now reaches students globally through an online course","The schoolteacher with 25 students who becomes a school administrator","The physician who transforms a single life","The artist who sells one painting at a time"],a:0,
 why:"That teacher/online-course pairing is one of the document's three short leverage illustrations."},
{id:"s14",c:"law-value",cat:"scenario",t:"mc",q:"A marketing agency publishes its best playbooks free, answers questions publicly, and audits prospects' funnels with no obligation. Inbound enquiries triple. Which law explains this most directly?",
 o:["The Law of Value — giving more in value than is taken in payment creates trust, distinction and loyalty","The Law of Compensation — reach has increased","The Law of Authenticity — the agency sounds like itself","The Law of Receptivity — the agency is accepting enquiries"],a:0,
 why:"Trust, distinction and loyalty are the three named effects of the First Law."},
{id:"s15",c:"manufacturing",cat:"scenario",t:"mc",q:"A law firm's revenue has been flat for six years. Partners bill 60 hours a week and the firm can't hire fast enough. In the document's terms, what is happening?",
 o:["A manufacturing model at its ceiling — output tied to input, with the classic symptoms of stagnation and overworked teams","A failure of the Law of Influence, since partners are not putting clients first","A failure of the Law of Authenticity in the firm's positioning","Vertical growth that has not yet compounded"],a:0,
 why:"The document names “overworked teams, diminishing margins, and vulnerability to disruption” as what happens when enterprises stay confined to manufacturing principles."},
{id:"s16",c:"leveraging",cat:"scenario",t:"mc",q:"That law firm wants leverage. Which option best fits the document's definition?",
 o:["Productise its most repeated advice into templates, software or a subscription service that clients use without partner hours","Open offices in three more cities with the same staffing model","Increase billable rates and reduce headcount","Recruit two more rainmaking partners"],a:0,
 why:"Leverage means reach growing “independently of direct input.” More offices and more partners is horizontal replication; higher rates just moves the same ceiling."},
{id:"s17",c:"law-influence",cat:"scenario",t:"mc",q:"A manager is promoted and finds nobody follows her lead despite her authority. Which document claim applies?",
 o:["Influence isn't about authority or titles — it is earned through trust built by genuine concern for others","She has failed the Law of Authenticity by changing on promotion","She is serving too few people to earn compensation","She has not yet built a system that scales her decisions"],a:0,
 why:"“Influence isn't about authority or titles… Influence is earned, not granted—and it's earned by placing service above self-interest.”"},
{id:"s18",c:"law-receptivity",cat:"scenario",t:"mc",q:"A nonprofit director is exhausted, does everything herself, and cannot understand why her most generous supporters have drifted away. Which of the document's four reasons for receptivity is she running into?",
 o:["Refusing to receive dishonours the giver and diminishes their offering","Receiving completes the circuit of generosity","Receiving unlocks abundance disguised as gifts","Receiving sustains your energy"],a:0,
 why:"All four apply eventually, but the supporters drifting away is specifically “It honors the giver. When you resist receiving, you diminish the other person's offering.”"},
{id:"s19",c:"stages",cat:"scenario",t:"mc",q:"A founder can now choose which projects to take, reinvest profits and explore new markets, but is not yet living in abundance. Which stage is this?",
 o:["Freedom","Survival","Luxury","Significance"],a:0,
 why:"Freedom is “the ability to make choices, reinvest, and explore new opportunities.”"},
{id:"s20",c:"stages",cat:"scenario",t:"mc",q:"A profitable company's founder now funds research that will outlive the business and mentors an entire industry. Which stage does the document describe?",
 o:["Significance — impact that endures, where compensation is measured in meaning","Luxury — investment into experiences beyond utility","Enlightenment — transcending profit and legacy entirely","Freedom — the ability to make choices"],a:0,
 why:"Significance: “a legacy of influence, contribution, and transformation… compensation is measured not only in wealth but in meaning.”"},
{id:"s21",c:"ex-netflix",cat:"scenario",t:"mc",q:"A regional video rental chain plans to survive by opening 200 more stores. Which document comparison should you invoke?",
 o:["Blockbuster vs Netflix — linear growth tied to locations and overhead against a single system serving millions","Amazon vs traditional retailers","Starbucks vs independent cafés","Duolingo vs Rosetta Stone"],a:0,
 why:"Blockbuster is the document's case for scaling “only by adding more physical locations and inventory.”"},
{id:"s22",c:"law-compensation",cat:"scenario",t:"mc",q:"A therapist wants greater income without abandoning care quality. Which of the Law of Compensation's three directives is she most in need of?",
 o:["Build systems that allow reach to grow independently of direct input","Expand the scope of lives served by working longer hours","Preserve or enhance the quality of service delivered","Raise fees until income matches ambition"],a:0,
 why:"She already has quality; the missing directive is the systems one, which is where the law demands leverage."},
{id:"s23",c:"law-value",cat:"scenario",t:"mc",q:"A software company adds a feature nobody asked for, then raises prices to cover it. Customers churn. Which distinction has it confused?",
 o:["It has added cost and price without adding value as the customer receives and experiences it","It has confused horizontal growth with vertical growth","It has confused influence with authority","It has confused giving with receiving"],a:0,
 why:"Value is defined from the customer's side of the transaction, not the builder's."},
{id:"s24",c:"law-authenticity",cat:"scenario",t:"mc",q:"A creator's audience grows fast after she starts posting in a voice that isn't hers. She is increasingly drained and considering quitting. Which document claim does this illustrate?",
 o:["“When you're true to yourself, you don't burn out—you burn bright” — inauthenticity costs energy as well as trust","Scale without values produces volatility rather than resilience","Compensation is a mirror of impact","Receiving completes the circuit"],a:0,
 why:"Energy is one of the four named reasons authenticity wins, alongside trust, differentiation and attracting the right people."},
{id:"s25",c:"ex-amazon",cat:"scenario",t:"mc",q:"A traditional wholesaler asks whether an old-fashioned business can ever become leveraged. Which document example answers this best?",
 o:["Amazon — it began holding inventory and shipping one order at a time, then shifted to logistics networks, third-party sellers, recommendations and AWS","Facebook — it grew from a dormitory project to billions of users","Duolingo — it gave away what competitors charged for","The hot dog vendor — he grew from a cart to restaurants"],a:0,
 why:"Amazon is the document's explicit transition case from manufacturing-style operations to leverage."},
{id:"s26",c:"law-influence",cat:"scenario",t:"mc",q:"A consultant volunteers to help a struggling peer win a pitch she isn't bidding on. Two years later that peer's company hires her for its largest programme. Which document claim is this?",
 o:["Influence brings opportunities you didn't ask for — referrals and recommendations that follow trust","Compensation grows with the number of people served","Receptivity unlocks abundance disguised as gifts","Value creates distinction in a crowded marketplace"],a:0,
 why:"“Influence is what brings you opportunities you didn't ask for. It's why people refer you without being prompted…”"},
{id:"s27",c:"overgiving",cat:"scenario",t:"mc",q:"A junior employee works unpaid weekends for a client who never notices, and calls it “giving more in value than I take.” What would the document say?",
 o:["That is random giving and self-sacrifice; the law calls for adding value strategically so the recipient experiences more than expected","That is a correct application of the First Law and will pay off eventually","That is the Law of Receptivity being violated by the client","That is horizontal growth of his personal brand"],a:0,
 why:"“You are not giving away value randomly—you are adding value strategically… This law is not about sacrificing yourself or working for free.”"},
{id:"s28",c:"scale",cat:"scenario",t:"mc",q:"An agency owner insists she cannot scale because she isn't a technology company. What does the document offer in response?",
 o:["Scale is no longer the privilege of multinationals — an individual can reach millions via platforms, SaaS or audiences at minimal incremental cost, and Starbucks scaled through systems, not software","She is right — leverage requires technology by definition","She should pursue horizontal growth instead","She should focus on the Law of Authenticity until conditions change"],a:0,
 why:"The document names the accessibility of scale as the Second Law's “most empowering feature,” and uses Starbucks as leverage without a technology product."},
{id:"s29",c:"ex-teacher",cat:"scenario",t:"mc",q:"Someone asks for one story that shows both scaling reach and staying true to yourself. Which does the document provide?",
 o:["The educator whose classroom games became a $200M edtech company while she remained a teacher at heart","The hot dog vendor who became a restaurateur","Duolingo's rise against Rosetta Stone","The leader who learned to say yes"],a:0,
 why:"The same story is told under the Law of Compensation and again under the Law of Authenticity."},
{id:"s30",c:"law-compensation",cat:"scenario",t:"mc",q:"An e-commerce founder automates fulfilment so orders can grow 10× without new hires. Which part of the framework is he applying?",
 o:["The systems directive of the Law of Compensation, and the input/output decoupling that defines leverage","Vertical growth, because automation creates new value","The Law of Receptivity, because he is accepting more orders","The Law of Influence, because customers will trust faster delivery"],a:0,
 why:"Reach growing independently of direct input is simultaneously the third compensation directive and the definition of leverage."},
{id:"s31",c:"law-value",cat:"scenario",t:"mc",q:"A hotel cannot afford to renovate but wants guests to feel they received more than they paid for. What does the document suggest is available to it?",
 o:["Value delivered through attitude, service and presence — not only through the product","A price reduction to close the value gap","Horizontal expansion into a second property","A loyalty programme to increase repeat visits"],a:0,
 why:"“Giving value isn't restricted to your product or service” — attitude, service and presence are named channels."},
{id:"s32",c:"ex-starbucks",cat:"scenario",t:"mc",q:"Two chains both have 500 outlets. One replicates a documented system that delivers a consistent experience; the other simply opens more shops and hopes each manager copes. How does the document read this?",
 o:["The first is leveraging through systems (the Starbucks case); the second is manufacturing at scale (the Blockbuster case)","Both are leveraged, because both are large","Both are manufacturing, because both are physical","The first is horizontal growth and the second is vertical"],a:0,
 why:"Size doesn't decide the model; whether a system replicates the value does."},
{id:"s33",c:"law-integration",cat:"scenario",t:"mc",q:"A startup delivers exceptional value and serves millions, but its founder is seen as self-serving and is quietly distrusted by partners. Which law is the weak link?",
 o:["Influence — Value opens the door and Compensation scales results, but Influence is what cements reputation and relationships","Authenticity — the founder is not being himself","Receptivity — the founder is not accepting help","Value — the product must not be as good as it appears"],a:0,
 why:"The document assigns exactly this role to the Third Law."},
{id:"s34",c:"law-receptivity",cat:"scenario",t:"mc",q:"An entrepreneur is offered an investment, a board seat and a keynote in the same month, and declines all three to stay focused on serving customers. What risk does the document identify?",
 o:["Opportunities often come disguised as gifts; being closed off means missing them, and the giving cycle eventually stalls","None — focus is consistent with the Law of Value","He is correctly avoiding the trap of luxury","He is applying authenticity by refusing roles that aren't him"],a:0,
 why:"“It unlocks abundance. Opportunities often come disguised as gifts. When you're closed off, you miss them.” Note the document doesn't say accept everything — it says stay open, and defines receptivity as readiness."},
{id:"s35",c:"input-output",cat:"scenario",t:"mc",q:"Which of these businesses is LEAST leveraged in the document's sense?",
 o:["A bespoke tailor who personally fits every garment","A newsletter with 200,000 subscribers written weekly","A franchised cleaning brand with 40 territories","A photo-editing app sold once and downloaded a million times"],a:0,
 why:"The tailor's output rises only with his own hours — the manufacturing relationship between input and output."},
{id:"s36",c:"law-authenticity",cat:"scenario",t:"mc",q:"An enterprise software firm's sales team is polished, scripted and interchangeable. A smaller rival's founder does demos personally, admits what the product can't do, and wins deals. Which document claim best explains the upset?",
 o:["In a noisy world of gimmicks and polish, authenticity cuts through — and it attracts the right people while repelling manipulation","The rival is giving more value than it takes in payment","The rival has better influence because it is smaller","The larger firm has scaled without values"],a:0,
 why:"Authenticity is presented as differentiation: “No one else can be you,” and people “can sense when you're trying to be impressive.”"},
{id:"s37",c:"law-compensation",cat:"scenario",t:"mc",q:"A boutique agency deliberately caps itself at eight clients to protect quality. In the document's terms, what trade-off has it made?",
 o:["It has optimised the quality term of the compensation equation while accepting a hard limit on the reach term","It has violated the Law of Value by restricting access","It has chosen significance over survival","It has adopted a leveraging model with a quality constraint"],a:0,
 why:"Compensation = lives touched × quality. Capping reach caps the product, however high quality goes — which is why the third directive is to build systems."},
{id:"s38",c:"values-guard",cat:"scenario",t:"mc",q:"A platform grows to 30 million users on a system that scales beautifully, but users feel misled by its pricing and quietly stop trusting it. What does the framework predict?",
 o:["Fragility — leverage without the guiding laws produces volatility and short-termism rather than resilience","Continued growth, since the system is doing the work","A move from freedom to luxury","A failure of horizontal growth"],a:0,
 why:"“Without the Five Laws, rapid expansion risks fragility and short-termism.”"},
{id:"s39",c:"horiz-vert",cat:"scenario",t:"mc",q:"A payments company launches in seven new countries using its existing platform. Is this horizontal or vertical growth in the document's terms?",
 o:["Horizontal — it replicates an existing model, though the platform underneath it is itself a leveraged system","Vertical — new markets mean new value","Neither — geographic expansion is outside the framework","Vertical, because the platform serves millions across borders"],a:0,
 why:"Vertical growth creates entirely new value; replicating a working model in new markets is replication. The document's own vertical example was designing the payment platform in the first place."},
{id:"s40",c:"law-influence",cat:"scenario",t:"mc",q:"A creator builds a large following through relentless self-promotion but finds nobody advocates for her when she launches a product. Which paradox from the document applies?",
 o:["People assume influence comes from self-promotion, but it is earned by placing service above self-interest","Compensation mirrors impact, so her following must be inflated","Authenticity repels manipulation, so her audience is misaligned","Receptivity requires readiness, which she lacks"],a:0,
 why:"“It's easy to assume that the path to influence lies in self-promotion. Yet, the greatest leaders, mentors, and connectors… gained their influence not through what they demanded, but through what they gave.”"},
{id:"s41",c:"law-value",cat:"scenario",t:"mc",q:"A subscription box company is deciding between a loyalty discount and a handwritten note plus a small unexpected extra in each box. Which is more aligned with the First Law as the document defines it?",
 o:["The note and the extra — they widen the gap between what the customer paid and what they received and experienced","The discount — a lower price directly increases value","Neither; the First Law concerns product quality only","Both are equivalent, since both cost the company money"],a:0,
 why:"Price and value are different dimensions. The document's value examples are experiential: atmosphere, service, being remembered, feeling appreciated."},
{id:"s42",c:"stages",cat:"scenario",t:"mc",q:"A family restaurant earns just enough each month to cover rent, wages and supplies. Which stage is it at, and what does the document say the model tends to focus on?",
 o:["Survival — and in manufacturing models survival is the focus: produce, deliver, recover costs, remain in operation","Freedom — it is still operating independently","Survival — but only because it has failed the Law of Value","Luxury — because it serves a local community well"],a:0,
 why:"“At the most basic level, service meets immediate needs… A business that serves a small group at this stage earns just enough for subsistence.”"},
{id:"s43",c:"systems",cat:"scenario",t:"mc",q:"Which of these is a leveraged asset in the document's sense — something that can be delivered endlessly without additional cost per unit?",
 o:["Netflix's original series","A restaurant's signature dish","A consultancy's senior partner","A retailer's flagship store"],a:0,
 why:"“each film or series could be streamed endlessly without additional cost per unit.”"},
{id:"s44",c:"law-integration",cat:"scenario",t:"mc",q:"A team applies Value, Compensation, Influence and Authenticity rigorously, but its leaders refuse help, never celebrate wins and underprice everything. What does the document predict?",
 o:["Imbalance and burnout — the fifth law exists precisely because the first four, alone, describe someone giving until they are depleted","Rapid growth, because four out of five laws are strong","A move directly to significance, skipping luxury","Failure of the Law of Value, since underpricing is overgiving"],a:0,
 why:"“giving without the ability to receive creates an imbalance… Giving without receiving leads to burnout.”"},

/* ===== CONNECTIONS / COMPARISONS ===== */
{id:"c01",c:"law-integration",cat:"connection",t:"mc",q:"How does the Law of Compensation relate to the Law of Value?",
 o:["It extends it from depth to breadth — from individual transactions to systemic impact","It replaces it once a business reaches scale","It contradicts it, since giving more reduces income","It is a moral version of the same economic claim"],a:0,
 why:"“The Second Law extends this principle from depth to breadth, from individual transactions to systemic impact.” Law 2 is Law 1 multiplied by reach."},
{id:"c02",c:"law-compensation",cat:"connection",t:"mc",q:"Why does leverage matter to the Law of Compensation?",
 o:["Because the law's third directive — build systems that let reach grow independently of direct input — can only be met by leverage","Because leverage raises the price customers will pay","Because compensation is capped by law in manufacturing models","Because leverage replaces the quality term of the equation"],a:0,
 why:"Reach is one of the two terms in the compensation equation, and without leverage reach grows only as fast as personal effort."},
{id:"c03",c:"values-guard",cat:"connection",t:"mc",q:"Why can scale without values become fragile?",
 o:["Technology, systems and capital create speed, but without values speed produces volatility rather than resilience","Because rapid growth always outruns operational capacity","Because customers eventually demand lower prices","Because scale reduces the quality of service by definition"],a:0,
 why:"Stated twice in the document: growth without values means rapid expansion and equally rapid collapse."},
{id:"c04",c:"law-integration",cat:"connection",t:"mc",q:"How do Influence and Authenticity reinforce one another?",
 o:["Both produce trust by different routes — Influence through putting others first, Authenticity through being real — and trust is what makes value travel","They are the same law expressed at individual and organisational levels","Influence generates authenticity over time","Authenticity is a technique for gaining influence"],a:0,
 why:"Influence: “trust is built through genuine concern for others.” Authenticity: “It builds trust. People follow those who are real.”"},
{id:"c05",c:"law-receptivity",cat:"connection",t:"mc",q:"If the first four laws emphasise giving, why is Receptivity necessary?",
 o:["Because giving without the ability to receive creates imbalance, burnout and a broken circuit — it ties the other four together","Because giving must eventually be repaid for the model to be fair","Because receiving is how compensation is measured","Because the fifth law is the reward for keeping the first four"],a:0,
 why:"“The Fifth Law ties the others together… success isn't about sacrifice—it's about flow.”"},
{id:"c06",c:"manufacturing",cat:"connection",t:"mc",q:"What separates a manufacturing model from a leveraging model at the most fundamental level?",
 o:["Whether output rises only in proportion to input, or can rise without proportional input","Whether the business is physical or digital","Whether the business is large or small","Whether the business is profitable or unprofitable"],a:0,
 why:"“Leverage redefines the relationship between input and output.” Everything else — physical/digital, big/small — follows from or is independent of that."},
{id:"c07",c:"leveraging",cat:"connection",t:"mc",q:"Why isn't leverage simply “working harder”?",
 o:["Working harder increases input to increase output; leverage multiplies impact without demanding equal increases in effort","Because leverage requires capital investment that effort cannot substitute for","Because hard work belongs to the survival stage only","Because leverage is about quality while effort is about quantity"],a:0,
 why:"“A leveraging model doesn't trade input for output in a straight line.” Its test question is “How far can this go without me?”"},
{id:"c08",c:"price-value",cat:"connection",t:"mc",q:"How does the document distinguish price from value, and why does the distinction matter?",
 o:["Price is paid, value is received and experienced — which means the gap between them can be widened at any price point","Price is the seller's number, value is the market's number — so pricing power determines worth","Price is short term, value is long term — so discounting builds value","Price is objective, value is subjective — so value cannot be managed"],a:0,
 why:"Because they are different dimensions, over-delivering doesn't require undercharging — the hot dog vendor and Duolingo both widened the gap."},
{id:"c09",c:"systems",cat:"connection",t:"mc",q:"How do systems change the relationship between input and output?",
 o:["A well-designed system continues to generate value long after the initial effort is complete, so reach stops depending on the founder's hours","Systems reduce cost per unit but leave the input/output link intact","Systems increase output by increasing the number of workers employed","Systems mainly improve quality rather than reach"],a:0,
 why:"That sentence appears in the leveraging section, and it is why leverage asks “How far can this go without me?”"},
{id:"c10",c:"laws-leverage-map",cat:"connection",t:"mc",q:"Which law does the document map to survival, and how?",
 o:["The Law of Value — enterprises endure by providing more value than they receive in payment, ensuring survival through indispensability","The Law of Compensation — income covers immediate needs first","The Law of Receptivity — accepting resources keeps a business alive","The Law of Influence — relationships sustain a business through hard times"],a:0,
 why:"“The Law of Value establishes the foundation… ensuring survival through indispensability.”"},
{id:"c11",c:"laws-leverage-map",cat:"connection",t:"mc",q:"Which law does the document map to significance, and why?",
 o:["Authenticity — significance is achieved when growth reflects integrity and genuine presence, making enterprises irreplaceable","Influence — because it is the heartbeat of legacy","Compensation — because significance requires scale","Receptivity — because significance requires reciprocity"],a:0,
 why:"Note the tension worth discussing: the Influence section separately calls the Third Law “the heartbeat of legacy… how you move from success to significance,” while the leverage mapping assigns significance to Authenticity. Both statements are in the document."},
{id:"c12",c:"law-integration",cat:"connection",t:"mc",q:"Compare the Law of Value and the Law of Compensation in one line. Which is most accurate?",
 o:["Value is depth per person; Compensation is that depth multiplied by breadth of people","Value is what you give; Compensation is what you are owed","Value is a philosophy; Compensation is a tactic","Value applies to individuals; Compensation applies to companies"],a:0,
 why:"The document's own framing is depth → breadth, individual transactions → systemic impact."},
{id:"c13",c:"stages",cat:"connection",t:"mc",q:"How do the five stages connect to the two business models?",
 o:["Manufacturing tends to keep the focus on survival; leveraging opens the door to freedom, luxury and ultimately significance","Manufacturing produces luxury; leveraging produces significance","The stages apply only to individuals, not to models","Each model reaches all five stages at different speeds"],a:0,
 why:"“In manufacturing, survival is the focus… In leveraging, you open the door to freedom, luxury, and ultimately significance, because the system you've built keeps creating value long after you stop working.”"},
{id:"c14",c:"law-influence",cat:"connection",t:"mc",q:"How does Influence relate to trust in the document's argument?",
 o:["Trust is the mechanism: putting others' interests first builds trust, and influence is what trust produces","Influence produces trust once results have been demonstrated","Trust and influence are synonyms in the framework","Trust is a precondition of authenticity, not influence"],a:0,
 why:"“True, lasting influence comes from trust, and trust is built through genuine concern for others.”"},
{id:"c15",c:"law-authenticity",cat:"connection",t:"mc",q:"What is the relationship between authenticity and value, per the document?",
 o:["Personality is the conduit through which value flows — authenticity is how Law 1's value reaches people","Authenticity replaces value once trust is established","Value is the product; authenticity is the marketing of it","They are independent virtues that happen to appear in the same framework"],a:0,
 why:"“Your personality is not separate from your success. It is the conduit through which value flows.”"},
{id:"c16",c:"law-value",cat:"connection",t:"mc",q:"How does the Law of Value dismantle the transactional mindset?",
 o:["In a transaction both parties exchange equal value and walk away; value-focused relationships create loyalty, referrals and lasting impact","By showing that transactions are unprofitable in the long run","By replacing pricing with reciprocity","By making the customer responsible for defining value"],a:0,
 why:"That contrast is stated directly under the First Law."},
{id:"c17",c:"scale",cat:"connection",t:"mc",q:"Why does the document insist compensation depends on how well you serve, and not only how many?",
 o:["Because compensation is a product of two terms — reach and quality — so scaling poor service does not scale reward","Because quality is easier to control than reach","Because customers pay premiums for quality regardless of scale","Because quality is the moral half and reach is the economic half"],a:0,
 why:"“compensation grows not with effort alone, but with the scale of service delivered and the excellence with which it is executed.”"},
{id:"c18",c:"conclusion",cat:"connection",t:"mc",q:"How does the document connect the manufacturing/leveraging distinction to the Five Laws in its conclusion?",
 o:["Manufacturing achieves stability but faces ceilings; leverage achieves exponential growth; only the laws turn that leverage into resilience","The laws are what allow manufacturing businesses to survive against leveraged competitors","The laws determine which model a business should choose","Leverage supersedes the laws once a business reaches scale"],a:0,
 why:"“Without the Five Laws, rapid expansion risks fragility and short-termism. With them, leverage becomes resilience.”"},
{id:"c19",c:"law-receptivity",cat:"connection",t:"mc",q:"How does Receptivity relate back to the Law of Value?",
 o:["Value flows in both directions; refusing to receive breaks the circuit that lets giving continue","Receptivity measures whether the value you gave was sufficient","Receptivity is the payment side of the value transaction","Receptivity replaces value once a reputation is established"],a:0,
 why:"“trusting that value flows in both directions, and allowing yourself to be part of that cycle.”"},
{id:"c20",c:"law-integration",cat:"connection",t:"order",q:"Reconstruct the framework: put these five laws in the order the document presents them.",
 items:["Law of Value","Law of Compensation","Law of Influence","Law of Authenticity","Law of Receptivity"],
 why:"Value (foundation) → Compensation (scale) → Influence (trust) → Authenticity (differentiation) → Receptivity (continuity)."},
{id:"c21",c:"thesis",cat:"connection",t:"order",q:"Reconstruct the document's overall argument in the order it is made.",
 items:["Value creation historically meant scale through repetition","Growth splits into horizontal replication and vertical new value","Leverage redefines the relationship between input and output","But systems and scale alone are insufficient without values","The Five Laws provide that foundation","Applied together, leverage becomes resilience and legacy"],
 why:"That is the document's structure: manufacturing baseline → horizontal/vertical → leverage → the values caveat → the laws → the synthesis."},
{id:"c22",c:"laws-leverage-map",cat:"connection",t:"match",q:"Match each law to the role the document assigns it in the framework's logic.",
 pairs:[["Value","Creates the foundation — indispensability"],["Compensation","Scales it — reach and quality"],["Influence","Cements reputation and relationships"],["Authenticity","Makes growth irreplaceable"],["Receptivity","Sustains the cycle"]],
 why:"Value opens the door, Compensation scales results, Influence cements relationships, Authenticity creates resonance, Receptivity ensures continuity."},
{id:"c23",c:"input-output",cat:"connection",t:"match",q:"Match each business to the model the document assigns it.",
 pairs:[["Blockbuster","Manufacturing — linear growth by adding stores"],["Netflix","Leveraging — one system, exponential reach"],["Pre-Starbucks cafés","Manufacturing — one shop, one owner, one neighbourhood"],["Facebook","Leveraging — scalability of the system, not branches"]],
 why:"These four are the document's cleanest model classifications."},

/* ===== MISCONCEPTIONS ===== */
{id:"m01",c:"overgiving",cat:"misconception",t:"mc",q:"Identify the misconception: “The Law of Value means you should undercharge and work for free until people notice you.”",
 o:["Wrong — the document says this is not about sacrificing yourself or working for free; you add value strategically, not randomly","Correct — the law asks you to give more than you take in payment","Partly right — the law applies only in the early stages of a business","Wrong — the law is only about product quality, not pricing"],a:0,
 why:"The document anticipates exactly this reading under “The Misconception of Overgiving.”"},
{id:"m02",c:"manufacturing",cat:"misconception",t:"mc",q:"Identify the misconception: “The document argues manufacturing models are obsolete and should be abandoned.”",
 o:["Wrong — it says both models play vital roles, that manufacturing built the modern economy, and that “this isn't about rejecting the past”","Correct — it says the future belongs to leverage","Partly right — it says manufacturing should be abandoned only in digital industries","Wrong — it never discusses manufacturing models directly"],a:0,
 why:"The critique is about clinging to manufacturing “in a leveraged age,” which caps potential — not about the model being worthless."},
{id:"m03",c:"leveraging",cat:"misconception",t:"mc",q:"Identify the misconception: “Leverage means technology. If you don't have software, you can't have leverage.”",
 o:["Wrong — the document names systems, networks AND technology, and uses Starbucks' franchising as leverage without a software product","Correct — the document's examples are all digital platforms","Partly right — non-technology leverage exists but the document doesn't discuss it","Wrong — leverage means capital, not technology"],a:0,
 why:"The Starbucks example is placed “even at the local level” to make exactly this point."},
{id:"m04",c:"law-influence",cat:"misconception",t:"mc",q:"Identify the misconception: “The Law of Influence is basically strategic networking — be nice to people who can help you.”",
 o:["Wrong — the document says putting others first works “not as a strategy, but as a way of being,” and that influence is “not just about networking”","Correct — influence is a relationship-building tactic","Partly right — it is networking, but with a longer time horizon","Wrong — influence in the document comes from expertise, not relationships"],a:0,
 why:"It is about “becoming the kind of person others want to be in business with,” not a transactional relationship strategy."},
{id:"m05",c:"law-receptivity",cat:"misconception",t:"mc",q:"Identify the misconception: “Receptivity means taking whatever you can get — it's the greedy law.”",
 o:["Wrong — “Receptivity is not about greed. It's about readiness,” and refusing to receive robs others of the joy of giving","Correct — it balances the giving laws with a taking law","Partly right — it permits self-interest once the other laws are satisfied","Wrong — receptivity is only about accepting feedback"],a:0,
 why:"The law is framed as completing a circuit, not as extracting value."},
{id:"m06",c:"law-compensation",cat:"misconception",t:"mc",q:"Identify the misconception: “The Law of Compensation says serve as many people as possible — volume is what pays.”",
 o:["Wrong — it is reach multiplied by quality; the document repeatedly pairs scale with “the excellence with which it is executed”","Correct — the law explicitly prioritises the number of people served","Partly right — quality matters only in premium markets","Wrong — the law is about pricing power, not volume"],a:0,
 why:"Both terms are required, and one directive is to “preserve or enhance the quality of service delivered.”"},
{id:"m07",c:"horiz-vert",cat:"misconception",t:"mc",q:"Identify the misconception: “Horizontal growth means small growth and vertical growth means big growth.”",
 o:["Wrong — horizontal means replicating an existing model and vertical means creating new value; the difference is leverage, not size","Correct — vertical growth is by definition larger","Partly right — horizontal growth is capped at a fixed size","Wrong — the terms refer to organisational hierarchy"],a:0,
 why:"“The distinction is not simply one of scale, but of leverage.”"},
{id:"m08",c:"price-value",cat:"misconception",t:"mc",q:"Identify the misconception: “To give more value than you take, lower your price.”",
 o:["Wrong — price and value are different dimensions; the gap widens by increasing what the customer receives and experiences","Correct — a lower price mathematically increases the value gap","Partly right — this works only for commodity products","Wrong — value is set by the market, not the seller"],a:0,
 why:"The document's value examples are experiential: atmosphere, service, being remembered, feeling appreciated."},
{id:"m09",c:"stages",cat:"misconception",t:"mc",q:"Identify the misconception: “The five stages are stages of personal wealth.”",
 o:["Wrong — they are stages of impact for “individuals and enterprises,” and the top two are measured in meaning and transformation rather than money","Correct — they run from subsistence to great wealth","Partly right — they are wealth stages for individuals only","Wrong — they describe the maturity of a market"],a:0,
 why:"At Significance “compensation is measured not only in wealth but in meaning”; Enlightenment “transcends profit and even legacy.”"},
{id:"m10",c:"ex-hotdog",cat:"misconception",t:"mc",q:"Identify the misconception: “The hot dog vendor succeeded because his hot dogs were the best in the city.”",
 o:["Wrong — the magazine named him the best outdoor dining EXPERIENCE, not the best hot dog stand; the value was experiential","Correct — product quality is the foundation of the First Law","Partly right — the food mattered most, the experience was secondary","Wrong — the story is about the Law of Compensation"],a:0,
 why:"That distinction is the point of the example."},
{id:"m11",c:"ex-duolingo",cat:"misconception",t:"mc",q:"Identify the misconception: “Duolingo proves you should make your product free.”",
 o:["Wrong — the document says “the key wasn't just that it was free—it was fun,” and revenue still comes from premium subscriptions, certifications and ads","Correct — free access is the mechanism the document credits","Partly right — free works only in education","Wrong — Duolingo illustrates the Law of Compensation, not Value"],a:0,
 why:"The lesson is the value/payment gap, not zero pricing."},
{id:"m12",c:"law-authenticity",cat:"misconception",t:"mc",q:"Identify the misconception: “Authenticity means saying whatever you feel, since being real is the point.”",
 o:["Wrong — the document ties authenticity to integrity, presence and sincerity as a competitive advantage, not to unfiltered self-expression","Correct — the law says your greatest gift is yourself","Partly right — authenticity permits candour in private but not in public","Wrong — authenticity in the document means transparency about pricing"],a:0,
 why:"It is framed as “a magnetic force in relationships, business, and leadership” and mapped to significance through “integrity and genuine presence.”"},
{id:"m13",c:"values-guard",cat:"misconception",t:"mc",q:"Identify the misconception: “The Five Laws are the motivational part of the document; the leverage material is the business part.”",
 o:["Wrong — the document explicitly calls them “not motivational slogans or abstract ideals” but functional principles determining whether leveraged growth is sustainable or fragile","Correct — the laws are inspirational framing around a business argument","Partly right — three laws are practical and two are philosophical","Wrong — the laws are the business part and leverage is the philosophy"],a:0,
 why:"This is the misreading the document works hardest to prevent."},
{id:"m14",c:"law-value",cat:"misconception",t:"mc",q:"Identify the misconception: “Giving more value than you take is a clever way to get more back — give to get.”",
 o:["Wrong — the document says “The intent is not manipulation—it's service,” and calls value a way of being rather than a tactic","Correct — the law works precisely because reciprocity is predictable","Partly right — the motive doesn't matter as long as value is delivered","Wrong — the law only applies to customers, not colleagues"],a:0,
 why:"It also says “those who ask how to give more are the ones who eventually receive the most” — the return is a consequence, not the aim."},
{id:"m15",c:"conclusion",cat:"misconception",t:"mc",q:"Identify the misconception: “The document's conclusion is anti-profit.”",
 o:["Wrong — it reframes financial return as the byproduct of service and says enterprises embodying the philosophy “will prosper financially”","Correct — it says legacy matters more than money","Partly right — it opposes profit only in leveraged businesses","Wrong — the conclusion doesn't address profit"],a:0,
 why:"Profit is repositioned in the causal chain, not rejected."},
{id:"m16",c:"ex-facebook",cat:"misconception",t:"mc",q:"Identify the misconception: “Facebook is one of the document's Five Laws examples.”",
 o:["Wrong — it appears in the opening leverage argument, before the laws are introduced","Correct — it illustrates the Law of Compensation","Partly right — it illustrates the Law of Value through free access","Wrong — Facebook is not mentioned in the document"],a:0,
 why:"It is used to establish that growth can come from system scalability rather than physical branches."},
{id:"m17",c:"law-integration",cat:"misconception",t:"mc",q:"Identify the misconception: “The Five Laws are an unordered list of good behaviours.”",
 o:["Wrong — they have dependencies: Compensation scales Value, Influence cements what the first two build, and Receptivity exists because the first four alone lead to depletion","Correct — the order is presentational only","Partly right — only the first two are ordered","Wrong — the laws are strictly sequential stages a business passes through"],a:0,
 why:"The document states the sequence roles directly and calls the Fifth Law the one that “ties the others together.”"},

/* ===== CRITICAL THINKING (evaluating the argument, not just recalling it) ===== */
{id:"k01",c:"law-compensation",cat:"critical",t:"mc",q:"A sceptic says: “Compensation clearly doesn't track people served — a hedge fund manager serves a handful of clients and out-earns a nurse who serves thousands.” What is the strongest response from within the document's own logic?",
 o:["The document's claim is about value delivered at scale, not headcount served: capital deployed for many beneficiaries is a form of reach, and where compensation and impact diverge the framework treats that as a failure to be corrected, not a law repealed","The document says this case is an exception to the Second Law","The document only claims the relationship holds in leveraged industries","The nurse is failing the Law of Compensation by not building systems"],a:0,
 why:"Worth being honest in conversation: the document asserts the correlation confidently — “compensation is a direct function of scale” — and does not systematically address counter-examples such as care work. Its own qualifier is “usually,” which concedes the relationship is a tendency rather than an identity."},
{id:"k02",c:"law-value",cat:"critical",t:"mc",q:"Critique: “Give more than you're paid for” could be used by employers to justify unpaid labour. What does the document offer against this, and what does it leave unanswered?",
 o:["It insists the law is “not about sacrificing yourself or working for free” and pairs it with Receptivity — but it addresses the individual's mindset rather than power imbalances between employer and worker","Nothing — the document endorses working without compensation","It resolves the problem entirely through the Law of Influence","It argues that exploitation is impossible when value is genuine"],a:0,
 why:"Strong conversational move: praise the internal safeguard (strategic addition plus receptivity) while noting the framework is written from the giver's point of view, so it under-examines who captures the surplus."},
{id:"k03",c:"law-authenticity",cat:"critical",t:"mc",q:"Critique: “Authenticity is only commercially advantageous when your authentic self happens to be likeable.” How does this sit with the document?",
 o:["The document claims authenticity attracts the right people and repels misalignment — implicitly conceding it narrows an audience rather than universally enlarging it","The document explicitly rejects this and says authenticity always increases market size","The document does not claim authenticity has commercial effects","The document says authenticity matters only in leadership roles"],a:0,
 why:"“It attracts the right people. Authenticity repels manipulation and draws those who align with your values.” Selection, not universal appeal — which is a fair-minded reading rather than a knock-down objection."},
{id:"k04",c:"leveraging",cat:"critical",t:"mc",q:"Critique: “Leverage can make organisations less resilient — one system failure takes down millions of users, where a hundred independent shops would not all fail at once.” How does this interact with the document?",
 o:["The document itself grants manufacturing models “resilience, reliability, and incremental advancement,” and answers fragility with values rather than with structural redundancy — a gap worth naming","The document denies that leveraged systems can fail","The document says redundancy is the sixth law","The document treats resilience as irrelevant to leveraged models"],a:0,
 why:"The document's account of fragility is values-based (“without values, speed produces volatility”). Concentration risk is a different mechanism it doesn't address — a legitimate, precise criticism to raise."},
{id:"k05",c:"laws-leverage-map",cat:"critical",t:"mc",q:"Are the Five Laws descriptive principles or motivational philosophy? What is the most defensible answer?",
 o:["The document insists they are functional principles determining sustainability — but they are stated as universal claims without measurement or counter-cases, so in practice they work best as a decision-making compass","They are purely motivational and the document admits this","They are empirically tested laws in the scientific sense","They are legal or regulatory principles"],a:0,
 why:"The honest reading: the framework's mechanisms (price vs value, input vs output, reach × quality) are genuinely analytical; its evidence is illustrative rather than systematic. Saying that shows command rather than scepticism."},
{id:"k06",c:"ex-duolingo",cat:"critical",t:"mc",q:"Critique the document's use of success stories. What is the methodological weakness?",
 o:["They are selected after the fact — Duolingo, Netflix, Amazon and Starbucks all succeeded, so we never see firms that gave enormous value or built systems and still failed","The examples are fictional and therefore inadmissible","The examples are too recent to establish a trend","The examples all come from a single industry"],a:0,
 why:"This is survivorship bias. A fair companion point: the document's own Blockbuster example is a failure case, so it isn't purely one-sided — it simply doesn't examine failed givers."},
{id:"k07",c:"law-receptivity",cat:"critical",t:"mc",q:"Critique: “Receptivity looks like the law that lets a giving framework quietly justify taking.” What is the fairest assessment?",
 o:["The document guards against this by defining receptivity as readiness rather than greed and tying it to sustaining the capacity to give — but the boundary between openness and self-interest is left to individual judgement","It is a fair hit; the document offers no distinction","The document resolves it by capping what may be received","The document treats receptivity as optional for that reason"],a:0,
 why:"A good conversational answer concedes the fuzziness while noting the document's test — does receiving sustain the flow of value, or interrupt it?"},
{id:"k08",c:"law-influence",cat:"critical",t:"mc",q:"Critique: “Placing others' interests first is a poor strategy in genuinely adversarial situations — a negotiation, a hostile market, a zero-sum bid.” How would the document likely respond?",
 o:["It would say putting others first “doesn't mean you neglect your own needs,” and that the pay-off is long-term trust rather than concession in any single encounter — though it doesn't analyse adversarial contexts directly","It would say adversarial situations should be avoided entirely","It would argue that influence is irrelevant in negotiation","It would concede that the Third Law does not apply in business"],a:0,
 why:"The document's own caveat — “That doesn't mean you neglect your own needs” — is the response; the absence of adversarial analysis is the honest concession."},
{id:"k09",c:"values-guard",cat:"critical",t:"mc",q:"Critique: “The claim that values-free growth collapses is asserted, not demonstrated.” What is the strongest balanced position?",
 o:["The mechanism is plausible and the document states it forcefully, but it offers no failure case of a values-free leveraged company — the argument's evidence sits on the success side only","The claim is demonstrated by the Blockbuster example","The claim is unfalsifiable and therefore meaningless","The claim is trivially true and needs no evidence"],a:0,
 why:"Blockbuster fails for model reasons (linear growth), not values reasons — so the document does not in fact supply a values-collapse example. That is a sharp observation to bring to a conversation."},
{id:"k10",c:"stages",cat:"critical",t:"mc",q:"Critique: “The five stages read as an aspirational ladder rather than an observed sequence — plenty of enterprises reach luxury without ever reaching significance.” How should this be handled?",
 o:["Grant it: the document presents the stages as what impact creates, not as an inevitable progression, and its own mapping treats them as what each law unlocks rather than as a guaranteed path","Reject it: the document says the stages always occur in order","Grant it and conclude the stages are meaningless","Reject it: the stages are empirically validated"],a:0,
 why:"The stages function as a vocabulary for kinds of return — subsistence, choice, abundance, meaning, transformation — which is defensible even if the ladder isn't deterministic."},
{id:"k11",c:"law-integration",cat:"critical",t:"mc",q:"Two statements in the document sit in tension: Influence is called “the heartbeat of legacy… how you move from success to significance,” while the leverage mapping assigns significance to Authenticity. What is the best way to handle this in conversation?",
 o:["Name it as a genuine overlap and resolve it by function: Influence produces significance through relationships and lifted people, Authenticity produces it through integrity and irreplaceability","Claim the document contradicts itself and the framework fails","Ignore the mapping section and use only the Influence claim","Treat significance as belonging to Compensation instead"],a:0,
 why:"Noticing overlaps and resolving them charitably is exactly what separates someone who read the document from someone who memorised its list."},
{id:"k12",c:"law-value",cat:"critical",t:"mc",q:"Critique: “Are highly compensated people always creating more value?” What does the document actually claim?",
 o:["It claims high earners “usually” impact disproportionately large numbers of people — a tendency, not a guarantee — and it does not address extraction, rent-seeking or inherited advantage","It claims the correlation is absolute and exceptionless","It claims compensation is unrelated to value","It claims only leveraged businesses show the correlation"],a:0,
 why:"Its strongest supporting line is the Bezos framing — wealth followed serving “an unprecedented number of people,” “not because he extracted value.” Extraction is acknowledged as a category but never examined."},
