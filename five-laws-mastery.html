<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Master the Framework — Five Laws &amp; Leverage</title>
<meta name="description" content="An adaptive, offline learning app for the Core Values / Five Laws of Value-Driven Success document.">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#f6f7fb; --bg-2:#ffffff; --bg-3:#eef0f7;
  --ink:#11141c; --ink-2:#414963; --ink-3:#6b7391;
  --line:#e2e5ef; --line-2:#d2d7e6;
  --brand:#3b5bfd; --brand-2:#6f4bf6; --brand-ink:#ffffff;
  --good:#0f8a5f; --good-bg:#e4f6ee;
  --bad:#c8324b; --bad-bg:#fdeaee;
  --warn:#a8690a; --warn-bg:#fdf1de;
  --accent:#0b8fa8;
  --shadow:0 1px 2px rgba(16,20,40,.05),0 8px 24px -12px rgba(16,20,40,.18);
  --shadow-lg:0 2px 4px rgba(16,20,40,.06),0 24px 48px -20px rgba(16,20,40,.28);
  --r:14px; --r-lg:20px; --r-sm:10px;
  --maxw:900px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --bg:#0b0d14; --bg-2:#141822; --bg-3:#1d2231;
    --ink:#f2f4fa; --ink-2:#b7bed4; --ink-3:#8790aa;
    --line:#252b3b; --line-2:#333b50;
    --brand:#7d92ff; --brand-2:#a98bff; --brand-ink:#0b0d14;
    --good:#4bd6a0; --good-bg:#0f2c22;
    --bad:#ff8098; --bad-bg:#33141d;
    --warn:#f0b45e; --warn-bg:#33260f;
    --accent:#5fd2e8;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 24px 48px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d14; --bg-2:#141822; --bg-3:#1d2231;
  --ink:#f2f4fa; --ink-2:#b7bed4; --ink-3:#8790aa;
  --line:#252b3b; --line-2:#333b50;
  --brand:#7d92ff; --brand-2:#a98bff; --brand-ink:#0b0d14;
  --good:#4bd6a0; --good-bg:#0f2c22;
  --bad:#ff8098; --bad-bg:#33141d;
  --warn:#f0b45e; --warn-bg:#33260f;
  --accent:#5fd2e8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 24px 48px -20px rgba(0,0,0,.8);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:clamp(15px,.92rem + .25vw,17px); line-height:1.6;
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + var(--sab));
}
h1,h2,h3,h4{line-height:1.22; margin:0 0 .4em; letter-spacing:-.02em; font-weight:700}
h1{font-size:clamp(1.5rem,1.2rem + 1.5vw,2.15rem)}
h2{font-size:clamp(1.22rem,1.05rem + .8vw,1.6rem)}
h3{font-size:clamp(1.05rem,.98rem + .4vw,1.22rem)}
h4{font-size:1rem}
p{margin:0 0 .9em}
ul,ol{margin:0 0 .9em; padding-left:1.25em}
li{margin:.3em 0}
a{color:var(--brand)}
strong{font-weight:650}
code,kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--bg-3);padding:.1em .35em;border-radius:5px}
:focus-visible{outline:3px solid var(--brand); outline-offset:2px; border-radius:6px}
::selection{background:color-mix(in srgb,var(--brand) 30%,transparent)}

/* ============================================================
   LAYOUT
   ============================================================ */
.app{max-width:var(--maxw); margin:0 auto; padding:0 clamp(14px,4vw,26px)}
header.top{
  position:sticky; top:0; z-index:60; background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(1.6) blur(14px); -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line); padding-top:var(--sat);
}
.top-in{max-width:var(--maxw); margin:0 auto; padding:10px clamp(14px,4vw,26px); display:flex; align-items:center; gap:10px}
.logo{display:flex; align-items:center; gap:9px; font-weight:750; letter-spacing:-.02em; font-size:.98rem; min-width:0}
.logo .mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-size:.78rem;font-weight:800;flex:0 0 auto}
.logo .txt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.top-spacer{flex:1}
.xp-chip{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:650;color:var(--ink-2);background:var(--bg-2);border:1px solid var(--line);padding:5px 10px;border-radius:99px;white-space:nowrap}
.progress-rail{height:3px;background:var(--bg-3);position:relative;overflow:hidden}
.progress-rail>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));width:0;transition:width .5s cubic-bezier(.2,.8,.3,1)}

main{padding:clamp(16px,4vw,30px) 0 40px; animation:fade .34s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* bottom nav */
nav.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:70;
  background:color-mix(in srgb,var(--bg-2) 92%,transparent);
  backdrop-filter:blur(16px) saturate(1.6); -webkit-backdrop-filter:blur(16px) saturate(1.6);
  border-top:1px solid var(--line); padding:6px max(6px,var(--sal)) calc(6px + var(--sab)) max(6px,var(--sar));
}
.tabs-in{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{
  appearance:none;border:0;background:transparent;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px;border-radius:12px;min-height:52px;cursor:pointer;
  font-size:.68rem;font-weight:650;letter-spacing:.01em;transition:color .18s,background .18s;
}
.tab svg{width:21px;height:21px;stroke-width:1.9}
.tab[aria-current="page"]{color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}
.tab:active{transform:scale(.96)}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(16px,4vw,22px);box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:12px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.three .stat b{font-size:clamp(1rem,.85rem+.6vw,1.35rem)}
.grid.three .stat span{font-size:.7rem;line-height:1.25;display:block}
@media(min-width:620px){.grid.two{grid-template-columns:1fr 1fr}}
.muted{color:var(--ink-3)}
.small{font-size:.85rem}
.tiny{font-size:.78rem}
.center{text-align:center}
.mt{margin-top:14px}.mt-s{margin-top:8px}.mb{margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.btn{
  appearance:none;font:inherit;font-weight:650;cursor:pointer;
  background:var(--brand);color:var(--brand-ink);border:1px solid transparent;
  padding:12px 18px;border-radius:12px;min-height:48px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s ease,filter .18s ease,background .18s;
  text-align:center;line-height:1.25;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.975)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--bg-2);color:var(--ink);border-color:var(--line-2)}
.btn.soft{background:var(--bg-3);color:var(--ink);border-color:transparent}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.87rem;border-radius:10px}
.btn.block{width:100%}
.btn.lg{min-height:56px;font-size:1.02rem;padding:14px 22px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.75rem;font-weight:700;letter-spacing:.02em;background:var(--bg-3);color:var(--ink-2);border:1px solid var(--line)}
.pill.brand{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);border-color:transparent}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}

.bar{height:9px;border-radius:99px;background:var(--bg-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .6s cubic-bezier(.2,.8,.3,1)}
.bar.good>i{background:linear-gradient(90deg,var(--good),#3ec9a0)}
.bar.warn>i{background:linear-gradient(90deg,var(--warn),#e0a44b)}

.kbd-hint{font-size:.74rem;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}

/* section heading */
.sec-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.sec-head .ico{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 22%,transparent),color-mix(in srgb,var(--brand-2) 22%,transparent));color:var(--brand)}
.sec-head .ico svg{width:22px;height:22px}
.sec-head h1,.sec-head h2{margin:0}
.sec-head p{margin:.25em 0 0;color:var(--ink-3);font-size:.9rem}

/* mastery ring */
.ring{--p:0;width:clamp(94px,27vw,118px);height:clamp(94px,27vw,118px);border-radius:50%;flex:0 0 auto;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--bg-3) 0)}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg-2)}
.ring .val{position:relative;z-index:1;text-align:center;line-height:1.05}
.ring .val b{display:block;font-size:clamp(1.25rem,1rem+1.6vw,1.55rem);letter-spacing:-.03em}
.ring .val span{font-size:.66rem;color:var(--ink-3);font-weight:650;text-transform:uppercase;letter-spacing:.06em}

.stat{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:1.35rem;letter-spacing:-.02em}
.stat span{font-size:.76rem;color:var(--ink-3);font-weight:600}

/* mode cards */
.mode{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:border-color .18s,transform .12s,box-shadow .18s;color:inherit;font:inherit;min-height:64px}
.mode:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.mode:active{transform:scale(.99)}
.mode .m-ico{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;background:var(--bg-3);color:var(--brand)}
.mode .m-ico svg{width:20px;height:20px}
.mode b{display:block;font-size:.98rem;margin-bottom:1px}
.mode span{display:block;font-size:.83rem;color:var(--ink-3);line-height:1.45}

/* choices */
.choices{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.choice{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--bg-2);border:1.5px solid var(--line-2);border-radius:13px;
  padding:13px 14px;min-height:52px;cursor:pointer;font:inherit;color:inherit;
  transition:border-color .16s,background .16s,transform .1s;
}
.choice:hover:not([disabled]){border-color:var(--brand)}
.choice:active:not([disabled]){transform:scale(.995)}
.choice .k{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--bg-3);display:grid;place-items:center;font-size:.76rem;font-weight:750;color:var(--ink-2);margin-top:1px}
.choice.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--bg-2))}
.choice.correct{border-color:var(--good);background:var(--good-bg)}
.choice.correct .k{background:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.wrong .k{background:var(--bad);color:#fff}
.choice[disabled]{cursor:default}

.feedback{border-radius:13px;padding:13px 15px;margin-top:12px;border:1px solid var(--line);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.feedback.ok{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.feedback.no{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.feedback h4{margin:0 0 .3em;font-size:.95rem}
.feedback p{margin:0 0 .5em;font-size:.9rem;line-height:1.55}
.feedback p:last-child{margin:0}

input[type=text],textarea,select{
  width:100%;font:inherit;color:var(--ink);background:var(--bg-2);
  border:1.5px solid var(--line-2);border-radius:12px;padding:12px 14px;min-height:48px;
}
textarea{min-height:130px;resize:vertical;line-height:1.55}
input[type=text]:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
label{font-weight:650;font-size:.88rem;display:block;margin-bottom:6px}

/* confidence */
.conf{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.conf button{min-height:56px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--bg-2);cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px}
.conf button b{font-size:1rem}
.conf button span{font-size:.6rem;color:var(--ink-3);text-align:center;line-height:1.2}
.conf button:hover{border-color:var(--brand)}

/* concept map */
.map-wrap{position:relative;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;overflow:hidden}
.map-svg{width:100%;height:auto;display:block;touch-action:manipulation}
.node-hit{cursor:pointer}
.node-box{transition:opacity .2s}
.dim{opacity:.22}
.edge{stroke:var(--line-2);stroke-width:2;fill:none;transition:stroke .2s,opacity .2s}
.edge.hot{stroke:var(--brand);stroke-width:3}

/* lesson */
.lesson-nav{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.lesson-nav::-webkit-scrollbar{height:5px}
.lesson-nav::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
.chip{flex:0 0 auto;border:1px solid var(--line-2);background:var(--bg-2);border-radius:99px;padding:8px 13px;font-size:.82rem;font-weight:650;cursor:pointer;color:var(--ink-2);min-height:40px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.chip .dot.m{background:var(--good)}

details.acc{border:1px solid var(--line);border-radius:13px;background:var(--bg-2);margin-bottom:9px;overflow:hidden}
details.acc>summary{cursor:pointer;padding:13px 15px;font-weight:650;font-size:.92rem;list-style:none;display:flex;align-items:center;gap:9px;min-height:48px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";margin-left:auto;font-size:1.2rem;color:var(--ink-3);font-weight:400}
details.acc[open]>summary::after{content:"−"}
details.acc>div{padding:0 15px 15px;font-size:.92rem;line-height:1.62;color:var(--ink-2)}
details.acc .tagico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--bg-3);font-size:.78rem;flex:0 0 auto}

blockquote{margin:0 0 12px;padding:12px 16px;border-left:3px solid var(--brand);background:var(--bg-3);border-radius:0 12px 12px 0;font-size:.95rem;line-height:1.6}
blockquote p:last-child{margin:0}
.src{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.mine{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--warn)}

.hook{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--bg-2)),color-mix(in srgb,var(--brand-2) 12%,var(--bg-2)));border:1px solid color-mix(in srgb,var(--brand) 24%,transparent);border-radius:13px;padding:13px 15px;font-weight:650;font-size:.95rem}

table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-2)}
.tbl-scroll table{min-width:460px}

/* matching / ordering */
.match-grid{display:grid;gap:8px}
.mitem{border:1.5px solid var(--line-2);background:var(--bg-2);border-radius:12px;padding:11px 13px;min-height:48px;display:flex;align-items:center;gap:10px;cursor:pointer;font:inherit;color:inherit;text-align:left;width:100%}
.mitem.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--bg-2))}
.mitem.done{border-color:var(--good);background:var(--good-bg);cursor:default;opacity:.75}
.mitem.err{border-color:var(--bad);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.order-list{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.ord{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line-2);background:var(--bg-2);border-radius:12px;padding:10px 12px;min-height:52px}
.ord .num{width:26px;height:26px;border-radius:8px;background:var(--bg-3);display:grid;place-items:center;font-weight:750;font-size:.8rem;flex:0 0 auto}
.ord .txt{flex:1;font-size:.9rem;line-height:1.4}
.ord .mv{display:flex;flex-direction:column;gap:2px}
.ord .mv button{width:34px;height:26px;border:1px solid var(--line-2);background:var(--bg-3);border-radius:7px;cursor:pointer;color:var(--ink-2);display:grid;place-items:center;font-size:.7rem;padding:0}
.ord.ok{border-color:var(--good);background:var(--good-bg)}
.ord.bad{border-color:var(--bad);background:var(--bad-bg)}

/* rapid fire */
.rf-timer{height:7px;border-radius:99px;background:var(--bg-3);overflow:hidden;margin-bottom:14px}
.rf-timer>i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--warn));transition:width .1s linear}
.combo{font-size:.8rem;font-weight:750;color:var(--warn)}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--sab));z-index:200;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:.86rem;font-weight:650;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:300;background:rgba(8,10,18,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px}
.modal{background:var(--bg-2);border-radius:var(--r-lg);padding:22px;max-width:440px;width:100%;box-shadow:var(--shadow-lg);border:1px solid var(--line)}

/* cheat sheet */
.cheat h3{margin-top:0}
.cheat .blk{border-left:3px solid var(--brand);padding-left:13px;margin-bottom:16px}
.numlist{counter-reset:n;list-style:none;padding:0;margin:0}
.numlist li{counter-increment:n;position:relative;padding-left:34px;margin-bottom:10px;font-size:.92rem;line-height:1.55}
.numlist li::before{content:counter(n);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:8px;background:var(--bg-3);color:var(--brand);display:grid;place-items:center;font-size:.74rem;font-weight:800}

/* boss */
.stage-track{display:flex;gap:5px;margin-bottom:16px}
.stage-track div{flex:1;height:6px;border-radius:99px;background:var(--bg-3)}
.stage-track div.on{background:linear-gradient(90deg,var(--brand),var(--brand-2))}

   mine:"Same games, same teacher, different distribution. That's the whole Second Law in one sentence."},
 "ex-amazon":{why:"It is the document's transition case — one company demonstrating both models — which is your best answer when someone asks whether a traditional business can become leveraged.",
   mine:"The tell is who does the work: at first Amazon shipped the boxes, now millions of sellers do."},
 "ex-netflix":{why:"It is the cleanest manufacturing-versus-leveraging comparison in the document and the likeliest question in a casual conversation.",
   mine:"Blockbuster's growth needed a lease and a lorry. Netflix's needed a server."},
 "ex-starbucks":{why:"It is the counter-example to 'leverage means tech', which is the most common misunderstanding of the whole framework.",
   mine:"38,000 stores is still a lot of buildings — but nobody had to be Howard Schultz to run one."},
 "ex-facebook":{why:"It establishes the input/output claim early, before any of the laws exist, so quoting it shows you read the argument in order.",
   mine:"No branch openings, no franchise agreements — just the same system, with more people inside it."},
 "ex-receptive":{why:"It is the only story attached to the Fifth Law, so it is what you reach for when someone asks why receptivity counts as a law at all.",
   mine:"She wasn't being humble; she was declining to be paid, which meant declining to keep serving."},
 "ex-small":{why:"These carry the document's sharpest single-line points, and questions frequently target them rather than the famous companies.",
   mine:"The physician-versus-pharmaceutical pair is the fairest test of the Second Law: same intent, different reach, wildly different reward."}
};
