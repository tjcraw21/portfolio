/* ---- TEACH-BACK (structured self-assessment, keyword based) ---- */
const TEACHBACK = [
{id:"t01",c:"law-value",prompt:"Explain the Law of Value as if you're explaining it to a friend over coffee.",
 required:[
  {label:"The gap between value given and payment taken",keys:["more in value","give more","than you take","exceeds what","beyond what they pa","more than they pa","more than expected","gap"]},
  {label:"Price and value are different things",keys:["price","pay","payment","cost"]},
  {label:"Value is what the customer receives or experiences",keys:["receive","experience","feel","get back","what they get"]}],
 optional:[
  {label:"Names an effect: trust, distinction or loyalty",keys:["trust","distinct","loyal","referral","word of mouth","word-of-mouth"]},
  {label:"Uses a document example (hot dog vendor, Duolingo, the $25 meal)",keys:["hot dog","vendor","duolingo","meal","cart","rosetta"]},
  {label:"Notes it is not working for free",keys:["not free","free work","sacrific","undercharg","burnout","strategic"]},
  {label:"Mentions attitude, service or presence",keys:["attitude","service","presence"]}],
 ideal:"The First Law says your true worth is how much more you give in value than you take in payment. The trick is that price and value aren't the same thing — price is the number they pay, value is everything they actually receive and experience. If someone pays $25 for a meal and walks out having had great food, warm service and a sense of being appreciated, they got far more than the price. The document's example is a hot dog vendor who remembered kids' names and birthdays and ended up featured in a magazine as the best outdoor dining experience, not the best hot dog stand — and that reputation is what got investors backing his first restaurant. It's not about working for free; it's about adding value strategically so nobody leaves a transaction feeling square. Trust, distinction and loyalty are what you get back.",
 stronger:"Say “widen the gap between price and value” rather than “give a lot” — it shows you understand these are two different dimensions, not one dial."},
{id:"t02",c:"law-compensation",prompt:"Explain the Law of Compensation, including why it isn't just about serving more people.",
 required:[
  {label:"Income depends on how many people you serve",keys:["how many","number of people","many people","reach","scale","serve more"]},
  {label:"And how well you serve them (quality)",keys:["how well","quality","excellen","well you serve"]},
  {label:"Compensation mirrors impact / scale",keys:["mirror","impact","function of scale","multiplied","product of"]}],
 optional:[
  {label:"Mentions building systems so reach grows independently of direct input",keys:["system","independent","without","leverage","direct input"]},
  {label:"Uses a document example (educator, Amazon, physician vs pharma)",keys:["teacher","educator","amazon","bezos","physician","pharmaceutical","200 million","games"]},
  {label:"Notes it is framed as economic, not just moral",keys:["economic","not moral","not just moral","economy"]},
  {label:"Mentions accessibility — individuals can scale too",keys:["linkedin","saas","individual","small business","anyone","platform"]}],
 ideal:"The Second Law is that your income is determined by how many people you serve and how well you serve them. It's really a multiplication: reach times quality. That's why it's an extension of the First Law rather than a separate idea — Law 1 is depth with one person, Law 2 is that same depth spread across many. The document is blunt that this is an economic claim, not a moral one: compensation becomes a mirror of impact. Its example is a teacher whose classroom card games reached a few dozen kids a year until they were digitised — same value, same quality, but now millions of children and over $200 million in annual sales. And the third directive is the one people skip: build systems so your reach can grow without your personal input growing with it. That's where the law quietly requires leverage.",
 stronger:"Frame it as a product of two terms. Anyone can say “serve more people”; saying “zero out either term and the result is zero” shows you understand the structure."},
{id:"t03",c:"law-influence",prompt:"Explain the Law of Influence and why influence isn't the same as authority.",
 required:[
  {label:"Influence comes from placing others' interests first",keys:["others","other people","their interest","put others","others first","serve"]},
  {label:"Trust is the mechanism",keys:["trust"]},
  {label:"Not authority, title or self-promotion",keys:["authorit","title","position","loudest","self-promot","promote yourself","power"]}],
 optional:[
  {label:"Mentions unrequested opportunities or referrals",keys:["referr","recommend","opportunit","didn't ask","without being asked","introduc"]},
  {label:"Uses the hot dog vendor example",keys:["hot dog","vendor","names","birthday","children","kids"]},
  {label:"Quotes or paraphrases “people don't care how much you know…”",keys:["how much you know","how much you care","care"]},
  {label:"Notes its role: Value opens the door, Compensation scales, Influence cements",keys:["cement","reputation","opens the door","scale your results","relationship"]}],
 ideal:"The Third Law says your influence is determined by how abundantly you place other people's interests first. The key move is decoupling influence from authority — it's not your title, and it's not being the loudest person in the room. It runs through trust: people give you influence when they believe you're genuinely invested in their success. The hot dog vendor is the example again, but read differently: he remembered children's names, birthdays, even their friends' names, so parents kept coming back and told other parents. That trust is what brought him partners and financial backers. The document has a nice structural line — Value opens the door, Compensation scales your results, but Influence is what cements your reputation and relationships. It's why opportunities arrive that you never asked for.",
 stronger:"Add the paradox explicitly: people chase influence through self-promotion, but the document says it's earned by placing service above self-interest — “not as a strategy, but as a way of being.”"},
{id:"t04",c:"law-authenticity",prompt:"Explain the Law of Authenticity and why the document treats it as a competitive advantage rather than a soft skill.",
 required:[
  {label:"The most valuable thing you offer is yourself",keys:["yourself","who you are","be you","being you","self"]},
  {label:"Technique or imitation can't substitute for it",keys:["technique","copy","mimic","imitat","persona","pretend","script","polish"]},
  {label:"It differentiates — no one else can be you",keys:["different","no one else","unique","stand out","irreplace"]}],
 optional:[
  {label:"Mentions trust",keys:["trust","real","sincer","genuine"]},
  {label:"Mentions energy / not burning out",keys:["energ","burn out","burnout","burn bright","drain"]},
  {label:"Mentions attracting the right people",keys:["right people","align","attract","repel"]},
  {label:"Uses the educator example",keys:["teacher","educator","tech mogul","sincerity","children"]},
  {label:"Personality as the conduit through which value flows",keys:["conduit","channel","flows through","vehicle"]}],
 ideal:"The Fourth Law is that the most valuable gift you have to offer is yourself. The document's target is the instinct to perform — the rehearsed pitch, the borrowed persona, copying someone you admire. Its argument is that no amount of technique beats showing up as yourself, for four reasons: it builds trust because people follow those who are real, it differentiates you because nobody else can be you, it energises you (“you don't burn out, you burn bright”), and it attracts people who actually align with you while repelling manipulation. The example is the teacher-turned-founder who never pretended to be a tech mogul — her sincerity became her competitive edge. The line I'd hold onto is that your personality isn't separate from your success; it's the conduit through which value flows. So it isn't a nice-to-have — it's the channel the First Law travels down.",
 stronger:"Use the word “conduit”. It reframes authenticity from a personality trait into a delivery mechanism, which is what makes it a business claim."},
{id:"t05",c:"law-receptivity",prompt:"Explain the Law of Receptivity, and why a framework about giving needs a law about receiving.",
 required:[
  {label:"Stay open to receiving",keys:["receiv","accept","open","say yes","take"]},
  {label:"Giving and receiving are interdependent / a cycle",keys:["cycle","circuit","both","interdependent","two sides","breath","flow","balance"]},
  {label:"Giving without receiving causes imbalance or burnout",keys:["burnout","burn out","imbalance","depleted","exhaust","drain","unsustain","stall"]}],
 optional:[
  {label:"Deflection is resistance to the flow of value, not humility",keys:["humility","humble","modest","deflect","decline","refus"]},
  {label:"Receiving honours the giver",keys:["honour","honor","joy of giving","robbing","diminish","the giver"]},
  {label:"Uses the leader who couldn't say yes",keys:["leader","undercharg","speaking","spotlight","advisor","she"]},
  {label:"Readiness, not greed",keys:["greed","readiness","ready"]},
  {label:"It ties the other four together",keys:["ties","together","sustain","continuit","complete"]}],
 ideal:"After four laws about giving, the natural conclusion is “just give more,” and the document says that's mostly true — but giving without the ability to receive creates an imbalance. It reframes the polite deflection, the “oh you shouldn't have,” as not humility but a quiet resistance to the flow of value, which breaks the cycle. Four reasons: receiving completes the circuit, it honours the giver, it sustains your energy, and it unlocks opportunities that arrive disguised as gifts. The story is a leader who gave endlessly, but refused help, declined speaking slots, undercharged and avoided the spotlight — she thought she was being modest and was actually blocking her own growth. Once she started saying yes, her impact multiplied and she had more energy to give. The definition to hold is “not greed — readiness.” It's the law that stops the other four from being a recipe for burnout.",
 stronger:"Note that undercharging appears in the document as a failure to receive, not a failure to price. That detail surprises people and shows you read closely."},
{id:"t06",c:"leveraging",prompt:"Explain the difference between a manufacturing model and a leveraging model.",
 required:[
  {label:"Manufacturing ties output to input / effort, time, resources",keys:["effort","time","resource","hours","input","direct","personal"]},
  {label:"Leveraging multiplies impact without proportional input",keys:["without","proportion","multipl","exponential","not linear","scale without"]},
  {label:"Systems, networks or technology carry the leverage",keys:["system","network","technolog","platform","software"]}],
 optional:[
  {label:"Uses Blockbuster vs Netflix, Amazon or Starbucks",keys:["blockbuster","netflix","amazon","starbucks","schultz","bezos"]},
  {label:"The two governing questions",keys:["how much can i do","how far can this go","without me"]},
  {label:"Manufacturing still has value — stability, resilience",keys:["stability","stable","resilien","reliab","not bad","vital","built the"]},
  {label:"The cart and track metaphor",keys:["cart","track","roll"]}],
 ideal:"A manufacturing model runs on Effort plus Time plus Resources equals Output — your income is tied to what you personally produce, so if you want more you put in more, and the ceiling is always near. A farmer is limited by land and season, a consultant by clients per week. A leveraging model breaks that straight line: systems, networks and technology let one idea reach thousands or millions without you expanding your hours. The cleanest example in the document is Blockbuster versus Netflix — Blockbuster grew by opening more stores, so growth cost overhead every time, while Netflix built one system that served millions, then added original shows that stream endlessly with no extra cost per unit. Manufacturing asks “How much can I do?” and leverage asks “How far can this go without me?” Importantly the document doesn't trash manufacturing — it says those models built the modern economy and give you stability and reliability. The problem is only clinging to them in an age defined by leverage.",
 stronger:"Use the “How far can this go without me?” question. It's the fastest test of whether something is genuinely leveraged."},
{id:"t07",c:"law-integration",prompt:"Explain how the Five Laws fit together as a system, not just a list.",
 required:[
  {label:"Value is the foundation",keys:["value","foundation","first","start"]},
  {label:"Compensation scales it",keys:["compensation","scale","reach","many people","breadth"]},
  {label:"Influence and/or Authenticity build trust and differentiation",keys:["influence","authentic","trust","reputation","different","irreplace"]},
  {label:"Receptivity sustains the cycle",keys:["receptiv","sustain","cycle","continu","burnout","flow"]}],
 optional:[
  {label:"Compensation is Value at breadth",keys:["depth","breadth","extension","extends","same idea"]},
  {label:"Value opens the door, Compensation scales, Influence cements",keys:["opens the door","cement","scales your results"]},
  {label:"The Fifth ties the others together",keys:["ties","together","final","governor","holds"]},
  {label:"Maps to survival, freedom, luxury, significance, continuity",keys:["survival","freedom","luxury","significance","continuit"]}],
 ideal:"They're layered rather than parallel. Value creates something genuinely worth more than its price — that's the foundation, and the document maps it to survival through being indispensable. Compensation is that same value at breadth: reach times quality, which is where freedom comes from. Influence is the trust layer — the document says Value opens the door and Compensation scales your results, but Influence is what cements reputation and relationships, and it reframes luxury as trust and loyalty rather than accumulation. Authenticity is the differentiation layer: nobody can copy you, which is what makes growth resonant and an enterprise irreplaceable — that's significance. And Receptivity is the governor. After four laws about giving, it's the one that stops the whole thing collapsing into burnout, by keeping the flow moving in both directions. So the dependencies are real: you can't scale value you don't have, and you can't keep giving if you never receive.",
 stronger:"Point out that Law 2 is Law 1 multiplied by reach. Treating them as two unrelated laws is the most common shallow reading."},
{id:"t08",c:"laws-leverage-map",prompt:"Explain how the Five Laws connect to survival, freedom, luxury, significance and enlightenment.",
 required:[
  {label:"Value → survival",keys:["value","survival","indispensab"]},
  {label:"Compensation → freedom",keys:["compensation","freedom","reach"]},
  {label:"Influence → luxury (as trust, not accumulation)",keys:["influence","luxury","trust","loyalty","reputation"]},
  {label:"Authenticity → significance",keys:["authentic","significance","integrity","presence","irreplace"]}],
 optional:[
  {label:"Receptivity → continuity",keys:["receptiv","continuity","sustain","reciproc","abundance"]},
  {label:"Manufacturing focuses on survival; leverage opens the higher stages",keys:["manufactur","survival is","leverage","open the door","freedom, luxury"]},
  {label:"Luxury redefined as trust rather than accumulation",keys:["not accumulation","not found in accumulation","rather than accumulation"]},
  {label:"Enlightenment transcends profit and legacy",keys:["enlighten","transcend","wisdom","alignment","broader system"]}],
 ideal:"The document maps each law onto a stage. Value gets you survival, but through indispensability — you last because people can't afford to lose you. Compensation gets you freedom, because reach gives you choices and the ability to reinvest. Influence gets you luxury, and it redefines luxury on the way: not accumulation, but the trust, loyalty and reputation that come from putting others first. Authenticity gets you significance, because growth that reflects integrity and genuine presence makes an enterprise irreplaceable. And Receptivity isn't really a rung — it's continuity, keeping abundance flowing both ways. The other half of that mapping is the model comparison: in a manufacturing business survival is the focus, and leverage is what opens the door to freedom, luxury and significance, because the system keeps producing value after you stop working. That mapping section is where the two halves of the document lock together.",
 stronger:"Mention that the document redefines luxury. Most people repeat the stages as a wealth ladder and miss that Law 3 reinterprets the third rung entirely."},
{id:"t09",c:"price-value",prompt:"Explain the difference between price and value, and why the distinction matters to the whole framework.",
 required:[
  {label:"Price is what is paid",keys:["price","pay","paid","charge"]},
  {label:"Value is what is received and experienced",keys:["receiv","experienc","get","feel"]},
  {label:"The gap is where worth lives",keys:["gap","more than","exceed","beyond","difference","worth"]}],
 optional:[
  {label:"Uses the $25 meal",keys:["25","meal","restaurant","atmosphere","apprecia"]},
  {label:"Notes value is created, not finite",keys:["not finite","create","not a commodity","unlimited"]},
  {label:"Notes you can widen the gap without cutting price",keys:["without lowering","not discount","same price","any price"]}],
 ideal:"Price is the number on the receipt; value is everything the customer actually receives and experiences. The document's example is a $25 meal where the value includes the atmosphere, the service, the food and the feeling of being appreciated — the transaction doesn't end when the plate is cleared. That distinction matters because it's what makes the First Law practical rather than sentimental: since price and value are different dimensions, you widen the gap by increasing what people receive, not by cutting what they pay. And the document says value isn't a finite commodity — it's something you create, which is why it thinks anyone in any field can apply this.",
 stronger:"Say explicitly that “give more value” does not mean “charge less.” That's the misreading that makes the law sound naive."},
{id:"t10",c:"values-guard",prompt:"Explain why the document argues that leverage without values is dangerous.",
 required:[
  {label:"Growth without values collapses quickly",keys:["collapse","fragil","fail","fall apart","volatil","short-term"]},
  {label:"Speed vs resilience",keys:["speed","resilien","volatil","fast","rapid"]},
  {label:"The laws act as a compass / guardrail",keys:["compass","guide","guard","principle","direct","anchor"]}],
 optional:[
  {label:"Technology, systems and capital create speed",keys:["technolog","system","capital"]},
  {label:"With the laws, leverage becomes resilience",keys:["becomes resilience","turns into","resilience"]},
  {label:"Laws are functional, not motivational",keys:["not motivational","functional","not slogans","practical"]}],
 ideal:"The document's hinge sentence is that enterprises which grow without a foundation of values expand rapidly but collapse with equal speed. Later it sharpens it: technology, systems and capital can create speed, but without values speed produces volatility rather than resilience. So leverage is amplification — it makes whatever you already are bigger and faster, including the flaws. That's why the Five Laws are introduced as the compass that directs expansion toward trust, sustainability and impact, and why the document insists they're functional principles rather than motivational slogans. The conclusion puts it in one line: without the laws, rapid expansion risks fragility and short-termism; with them, leverage becomes resilience.",
 stronger:"Use the word “amplifier”. Leverage doesn't create character, it multiplies whatever character is already there — that framing makes the argument land in one sentence."},
{id:"t11",c:"ex-netflix",prompt:"Use Blockbuster and Netflix to explain the core divide in the document.",
 required:[
  {label:"Blockbuster grew by adding stores — linear",keys:["store","location","physical","linear","inventory","overhead"]},
  {label:"Netflix used one system to serve millions",keys:["system","technolog","stream","millions","without","platform"]},
  {label:"The variable is growth mechanism, not just digital vs physical",keys:["proportion","linear","exponential","effort","input","mechanism","model"]}],
 optional:[
  {label:"Original content as leveraged IP",keys:["original","intellectual property","ip","content","no additional cost","per unit"]},
  {label:"Same industry, opposite models",keys:["same industry","both","two companies"]},
  {label:"Exponential vs linear",keys:["exponential","linear"]}],
 ideal:"They started in the same industry and chose opposite models. Blockbuster was pure manufacturing thinking: more stores meant more rentals, more rentals meant more revenue, so every increment of growth cost another lease, another set of shelves, more overhead — linear growth bolted to resources. Netflix used technology to remove the physical constraint, so one system could serve millions without expanding effort proportionally. Then it did the subtler thing: producing original shows meant it owned intellectual property that could be streamed endlessly with no additional cost per unit. That's the divide in miniature — it isn't really digital versus physical, it's whether growth requires proportional input. Starbucks makes the same point from the other direction: 38,000 physical stores, but the system replicates the value, not the founder's effort.",
 stronger:"Adding the Starbucks counterpoint is what stops this sounding like “tech won.” It shows you understood the mechanism rather than the headline."},
{id:"t12",c:"thesis",prompt:"Someone asks: “So what's this document actually arguing?” Give your one-minute answer.",
 required:[
  {label:"Two models: manufacturing (linear) and leveraging (multiplied)",keys:["manufactur","leverag","linear","multipl","two model"]},
  {label:"Leverage changes the input/output relationship",keys:["input","output","proportion","without","effort"]},
  {label:"Values / the Five Laws are required for that growth to endure",keys:["five laws","values","principle","endure","sustain","collapse","resilience"]}],
 optional:[
  {label:"Names the Five Laws",keys:["value","compensation","influence","authentic","receptiv"]},
  {label:"Mentions the stages",keys:["survival","freedom","luxury","significance","enlighten"]},
  {label:"Uses at least one example",keys:["netflix","blockbuster","amazon","duolingo","starbucks","hot dog","facebook","teacher"]},
  {label:"Closes with transformation over transactions",keys:["transformation","transaction","meaning","margins"]}],
 ideal:"It's a two-part argument. Part one: growth used to mean repetition — more factories, more staff, more hours — so output was chained to input and there was always a ceiling. Leverage breaks that chain, because a system, a network or a technology can serve millions without proportional labour. Blockbuster added stores; Netflix built one system. Part two, and this is the bit people skip: the document immediately says systems and scale alone are insufficient, because companies that grow without values expand fast and collapse just as fast. So it introduces the Five Laws — Value, Compensation, Influence, Authenticity, Receptivity — as the operating principles that decide whether leveraged growth is durable or fragile. It even maps them onto stages: Value gets you survival, Compensation freedom, Influence luxury reframed as trust, Authenticity significance, Receptivity continuity. The conclusion is that business endures not through transactions but through transformation — profit is the byproduct of service, not the point of it.",
 stronger:"Lead with the two-part structure. Most people summarise only the leverage half, which makes the Five Laws sound like a bolted-on sermon instead of the load-bearing half of the argument."},
{id:"t13",c:"law-compensation",prompt:"Explain to a sceptical colleague why the Law of Compensation is presented as economics rather than morality.",
 required:[
  {label:"The claim is that markets reward value created at scale",keys:["economy","economic","market","reward","scale"]},
  {label:"Compensation mirrors impact / lives touched",keys:["mirror","impact","lives","people served","reach"]},
  {label:"It dismantles the belief that rewards are arbitrary",keys:["arbitrar","unfair","limiting belief","luck","rigged","distributed"]}],
 optional:[
  {label:"Physician vs pharmaceutical founders",keys:["physician","doctor","pharmaceutical","millions"]},
  {label:"Bezos served rather than extracted",keys:["bezos","amazon","extract","unprecedented"]},
  {label:"Notes “usually” — a tendency, not a law of physics",keys:["usually","tendency","not always","generally"]}],
 ideal:"The document is explicit that this isn't a moral claim: it says the modern economy rewards those who create value at scale, and that compensation is a direct function of the number of lives touched multiplied by the quality of service. Its example is a physician who transforms one life at a time versus the founders of a pharmaceutical company delivering similar relief to millions — same intent, different reach, wildly different reward. It uses that to dismantle a limiting belief, that rewards are arbitrarily distributed and only certain professions get paid well; its answer is that people who earn disproportionately usually impact disproportionately large numbers of people. And it insists Bezos got wealthy by serving an unprecedented number of people rather than by extracting value. I'd add the honest caveat: the document says “usually,” so it's asserting a strong tendency, and it doesn't really examine cases where pay and impact come apart.",
 stronger:"Volunteering the “usually” qualifier is what makes you sound like a reader rather than a believer — you can hold the claim and its limits at the same time."},
{id:"t14",c:"overgiving",prompt:"A friend says “Giving more value than you're paid for is just working for free.” Answer them.",
 required:[
  {label:"The document explicitly rejects self-sacrifice and free work",keys:["not free","working for free","sacrific","not about"]},
  {label:"Adding value strategically vs giving randomly",keys:["strategic","random","deliberate","targeted","intentional"]},
  {label:"Receptivity balances it",keys:["receptiv","receiv","accept","fifth","balance","flow"]}],
 optional:[
  {label:"Value can be attitude, service, presence — often low cost",keys:["attitude","service","presence","care","attention","insight","cheap","costs nothing"]},
  {label:"Profit is the natural result, not the purpose",keys:["profit","natural result","byproduct","follows"]},
  {label:"The exchange still happens — you still charge",keys:["still charge","still paid","price","get paid","charge"]}],

{id:"cv01",tone:"open",q:"So — what did you think of the material?",
 points:["Give a one-line verdict before any detail","Name the two-part structure: leverage + values","Say what surprised or convinced you","Land on one concrete example"],
 answer:"I liked it more than I expected to, mainly because it's two arguments stitched together rather than one. The first half is a fairly hard-nosed business argument about leverage — that most growth historically meant repetition, so output was chained to input, and systems and networks break that chain. The second half is the values argument, and the connective tissue is a line that stuck with me: technology and capital create speed, but without values speed produces volatility rather than resilience. What I found convincing was that it doesn't dismiss traditional businesses — it says manufacturing models built the modern economy and give you stability. It just says clinging to them now caps you.",

{id:"cv05",tone:"friendly",q:"Can you give me an example from the document?",

{id:"cv06",tone:"friendly",q:"How would this apply to your own career?",
 points:["Name your current manufacturing constraint","Identify one leverage move available","Reference the systems directive of Law 2","Be concrete, not aspirational"],
 answer:"Most of what I do is manufacturing in the document's sense — the output is basically a function of my hours, and the ceiling is the calendar. The Law of Compensation has three directives and I've only really been running two: serve more people, serve them well. The third one is the interesting one — build systems so reach grows independently of direct input. In practice that means the things I explain repeatedly should exist as something reusable rather than as a meeting. Same value, but it stops needing me to be in the room.",

{id:"cv07",tone:"skeptical",q:"Do you actually agree with the framework?",

 answer:"Mostly, with one reservation. The mechanical parts I think are genuinely analytical: price versus value, input versus output, compensation as reach times quality — those are useful distinctions I'd use whether or not I bought the philosophy. Where I'd push back is the evidence. Every company it cites succeeded, so we never see the firms that gave enormous value and still failed. And the central claim that values-free growth collapses is asserted forcefully but never demonstrated with a case — the one failure story, Blockbuster, fails for model reasons, not values reasons. I still think the compass is a good compass. I just wouldn't call it proven.",

{id:"cv08",tone:"skeptical",q:"What are its weaknesses?",
 points:["Survivorship bias in examples","Compensation/impact correlation is asserted","Written from the giver's point of view — power imbalances unexamined","Leverage fragility (concentration risk) not addressed","Say what it does well too"],
 answer:"Four, I'd say. Survivorship bias — the examples are all winners. The compensation claim is stated as an economic law but hedged with the word “usually,” and it never addresses extraction or inherited advantage. It's written entirely from the giver's perspective, so it doesn't examine who captures the surplus when the person giving more has less power. And it treats fragility as a values problem, when leverage also creates concentration risk — one system failing takes down millions of users in a way a hundred independent shops wouldn't. To be fair, it's honest about manufacturing models having real resilience, which many leverage arguments aren't.",

{id:"cv09",tone:"skeptical",q:"Isn't “give more value than you receive” just working for free with extra steps?",
 points:["The document anticipates this directly","Strategic addition vs random giving","Receptivity is the internal check","Value is often experiential and low cost"],

{id:"cv10",tone:"friendly",q:"What's the difference between the Law of Value and the Law of Compensation?",

 followUp:"So which one does a small, excellent business fail on?"},
{id:"cv11",tone:"skeptical",q:"Why is Receptivity even considered a law? It sounds like advice.",
 points:["It corrects the natural misreading of laws 1-4","Interdependence: breathing in and out","Refusing to receive harms the giver too","Continuity in the leverage mapping"],
 answer:"Because without it the first four are a recipe for depletion. The document says it plainly: after Value, Compensation, Influence and Authenticity, you'd conclude the answer is just give more — and it says that's mostly true, but giving without the ability to receive creates imbalance. The framing that convinced me is that it's not a personal-wellbeing point, it's a systems point. If you refuse what people offer you, you break their side of the exchange too — the document says you rob them of the joy of giving. And in the leverage mapping it isn't assigned a rung on the ladder at all; it's assigned continuity, which is a different job from the other four.",
 followUp:"Where's the line between healthy receptivity and just taking what you can get?"},
{id:"cv12",tone:"friendly",q:"Can a traditional manufacturing business still use leverage?",
 points:["Yes — Amazon and Starbucks are the document's cases","Systems, not just software","The owner-dependence test","Manufacturing isn't rejected"],
 answer:"Yes, and the document gives two cases specifically for that. Amazon started out holding inventory and shipping one order at a time — completely manufacturing — and shifted into logistics networks, third-party sellers, recommendation systems and eventually AWS, to the point where it now runs the system millions of other sellers use. And Starbucks is the deliberate non-tech example: cafés used to be one shop, one owner, one neighbourhood, and Schultz built a system that delivered a consistent experience worldwide — 38,000 locations. Still physical, still coffee. The variable isn't digital versus physical, it's whether the system replicates the value or the owner does.",
 followUp:"So what's the difference between Starbucks opening 38,000 stores and Blockbuster opening stores?"},
{id:"cv13",tone:"skeptical",q:"How do these principles actually make a company more successful? Give me a mechanism.",
 points:["Value → trust, distinction, loyalty → referrals","Reach × quality → compensation","Influence → unrequested opportunity","Authenticity → differentiation and energy","Receptivity → sustained capacity"],
 answer:"Each one has a fairly concrete channel. Value produces trust, distinction and loyalty, which shows up commercially as referrals and word of mouth rather than paid acquisition — the vendor got investors because of his reputation, not his margins. Compensation is straightforwardly arithmetic: reach times quality, so systems that grow reach without growing cost move the result. Influence produces deal flow you didn't pay for — the document's phrase is opportunities you didn't ask for, and in its own story the seed capital arrives through a connector. Authenticity is differentiation plus retention of energy, which matters because burnout is a real business risk. And Receptivity keeps capacity from draining out. It's not mystical; it's mostly trust reducing friction and cost.",
 followUp:"Which of those would show up first in a company's numbers?"},
{id:"cv14",tone:"skeptical",q:"What happens when leverage exists without values?",
 points:["Rapid expansion, equally rapid collapse","Speed produces volatility, not resilience","Fragility and short-termism","Leverage amplifies what's already there"],
 answer:"The document's answer is that you get speed without resilience. Its exact framing is that enterprises which grow without a foundation of values expand rapidly but collapse with equal speed, and later, that technology, systems and capital create speed but without values that speed produces volatility. The way I'd put it is that leverage is an amplifier — it doesn't create character, it multiplies whatever is already there. The conclusion says without the laws, rapid expansion risks fragility and short-termism; with them, leverage becomes resilience. That's the whole book in one sentence, really.",
 followUp:"Can you name a real company where that played out? And does the document actually give one?"},
{id:"cv15",tone:"friendly",q:"How does the document distinguish price from value?",
 points:["Price paid vs value received and experienced","The $25 meal","The gap is the worth","Doesn't mean discounting"],
 answer:"Price is what a customer pays; value is what they receive and experience as a result. The example is a $25 meal — the transaction doesn't end with the food, because the value includes the atmosphere, the service and the sense of being appreciated. What I find useful is the consequence: because they're different dimensions, giving more value doesn't mean charging less. You widen the gap by increasing what people receive.",
 followUp:"So is a cheap product with poor service high value or low value in this framework?"},
{id:"cv16",tone:"friendly",q:"Why does the document care so much about authenticity? It seems like the softest of the five.",
 points:["It is a conduit, not a personality trait","Four named effects: trust, differentiation, energy, right people","Mapped to significance and irreplaceability","The educator example"],
 answer:"Because it isn't positioned as a personality trait — it's positioned as infrastructure. The line is that your personality is not separate from your success, it's the conduit through which value flows. So if Law 1 creates value, Law 4 is the channel it reaches people through. Then it gives four hard-edged reasons: trust, because people follow those who are real; differentiation, because nobody else can be you; energy, because pretending is exhausting; and selection, because it attracts aligned people and repels manipulation. In the leverage mapping it's what makes an enterprise irreplaceable, which is a competitive claim, not a moral one.",
 followUp:"But surely authenticity only helps if your authentic self is commercially appealing?"},
{id:"cv17",tone:"skeptical",q:"Does compensation really correlate with the number of people you serve? What about nurses and teachers?",
 points:["State the document's claim honestly","Note the hedge word “usually”","Give the physician/pharma example","Concede the gap rather than defending it"],
 answer:"The document claims it fairly strongly — compensation as a direct function of lives touched times quality — and its cleanest illustration is a physician who transforms one life versus pharmaceutical founders delivering relief to millions. But it also hedges: it says people who earn disproportionately usually impact disproportionately large numbers. That “usually” is doing a lot of work, and care professions are exactly where the correlation breaks. My honest reading is that it describes a real tendency in how markets price scaled value, and it doesn't grapple with the cases where social value and market compensation come apart. I'd rather say that than pretend the framework covers it.",
 followUp:"If the correlation breaks, does the law survive as anything more than motivation?"},
{id:"cv18",tone:"friendly",q:"What's the relationship between influence and trust?",
 points:["Trust is the mechanism, influence the output","Others' interests first is the input","Not authority or titles","Unrequested opportunity as the payoff"],
 answer:"Trust is the mechanism that converts behaviour into influence. The chain is: you place others' interests first, that builds trust, and influence is what trust produces. The document is explicit that this is not authority or a title — it says influence is earned, not granted. And the payoff it describes is a specific one: opportunities you didn't ask for, people who refer you without being prompted or defend you in rooms you're not in.",
 followUp:"How is that different from just being a good networker?"},
{id:"cv19",tone:"skeptical",q:"Isn't this all just “be a good person and you'll get rich”?",
 points:["Reject the caricature but concede the resemblance","Point at the mechanical half of the document","The laws as functional principles claim","Note where the document does slip into philosophy"],
 answer:"It's a fair worry, and parts of it do read that way — the closing pages get lyrical. But the spine of it isn't a morality tale. Half the document is a fairly technical argument about growth models: horizontal versus vertical, input versus output, systems that keep producing value after you stop working. And it insists the laws are functional principles determining whether leveraged growth is sustainable or fragile, explicitly not motivational slogans. Where I'd concede ground is that the evidence is illustrative rather than systematic, so it's better understood as a compass than a proof.",
 followUp:"So if it's a compass, what would it actually tell you to do differently on Monday?"},
{id:"cv20",tone:"friendly",q:"Which example from the document do you find most convincing, and which least?",
 points:["Pick one of each with reasons","Convincing: Amazon or Netflix — mechanism visible","Less convincing: the anonymous stories — unfalsifiable","Stay fair-minded"],
 answer:"Most convincing is Amazon, because you can watch the mechanism change rather than just the outcome — the same company holding inventory and shipping one order at a time, then building logistics, third-party selling and AWS until it became the system other sellers run on. Least convincing are the anonymous parables, the vendor and the teacher. They're vivid and they teach the idea well, but they're unverifiable and told backwards from the happy ending, so they illustrate rather than evidence. I'd still use them in conversation — just as illustrations.",
 followUp:"Does it matter that the stories may be composites, if the principle holds?"},
{id:"cv21",tone:"friendly",q:"What's the difference between horizontal and vertical growth?",
 points:["Replication vs new value","Restaurant branches vs payment platform","Not simply a matter of scale","Ties into leverage"],
 answer:"Horizontal growth replicates a model you already have; vertical growth creates entirely new value. The document's pair is a company opening more branches of an existing restaurant versus a company designing a payment platform that serves millions across borders. And there's a sentence that keeps people honest about it: the distinction is not simply one of scale, but of leverage. So a huge chain can be growing horizontally, and a small team can be growing vertically.",
 followUp:"Which one is a franchise, then — horizontal or vertical?"},
{id:"cv22",tone:"skeptical",q:"Can giving more than you receive encourage exploitation?",
 points:["Acknowledge the risk honestly","The document's guards: strategic, not sacrificial; plus Receptivity","Note what it doesn't address: power asymmetry","Offer the practical test"],
 answer:"Yes, and I think that's the sharpest criticism you can make of it. The framework is written from the giver's point of view, so it optimises the individual's mindset and doesn't really examine who captures the surplus when the person giving has less power. It does have internal guards — it says explicitly this isn't self-sacrifice or working for free, and the Fifth Law treats undercharging and refusing help as failures rather than virtues. But “stay open to receiving” is advice to the individual, not a check on an employer using the same language to extract free labour. I'd hold both: good compass for how you work, not a theory of bargaining power.",
 followUp:"So how would you apply it in a job where the power imbalance is real?"},
{id:"cv23",tone:"friendly",q:"Talk me through the five stages.",
 points:["Name them in order","Give one distinguishing detail each","Link them to the two models","Note luxury gets redefined"],
 answer:"Survival, Freedom, Luxury, Significance, Enlightenment. Survival is subsistence — food, shelter, safety, enough to stay in operation. Freedom is where stability gives you choice: reinvest, explore, say no. Luxury is abundance, the reward of scale, investing beyond utility. Significance is where the return stops being material — the document says compensation is measured not only in wealth but in meaning. And Enlightenment is the pinnacle, where business transcends profit and even legacy and becomes a force for transformation and wisdom in the wider system. The neat part is how they attach to the models: manufacturing keeps you focused on survival, and leverage is what opens the door to the higher rungs, because the system keeps creating value after you stop working. And Law 3 redefines luxury on the way — not accumulation, but trust and reputation.",
 followUp:"Is Enlightenment doing real work in the framework, or is it decoration?"},
{id:"cv24",tone:"skeptical",q:"Which law is easiest to get wrong in practice?",
 points:["Compensation — dropping quality while chasing reach","Or Value — mistaking discounting for value","Explain the failure mode","Give the corrective"],
 answer:"Compensation, easily. It's a product of two terms and people hear only the first one, so they chase reach and let quality erode — which in the framework doesn't just fail morally, it fails arithmetically, because the result is reach times quality. The document keeps pairing scale with the excellence with which it's executed for exactly that reason. The close runner-up is Value, where people hear “give more” and reach for a discount, when price and value aren't even the same dimension.",
 followUp:"How would you tell, early, that a company had made that mistake?"},
{id:"cv25",tone:"skeptical",q:"If the framework is so universal, why do so many values-driven companies fail?",
 points:["The document doesn't claim values are sufficient","Both halves are required: leverage and values","Concede the survivorship problem","Reframe as necessary-not-sufficient"],
 answer:"Because values are never presented as sufficient in it — they're presented as what makes leveraged growth durable. The document's structure is quite careful there: leverage without values collapses, but values without leverage just leaves you at survival with a ceiling. So a values-driven company that never solves reach or systems is exactly what the framework predicts stalls. Where the document is genuinely vulnerable is the reverse case — it never shows us a company with great values that failed anyway, because all its examples are winners.",
 followUp:"So is it falsifiable at all?"},
{id:"cv26",tone:"friendly",q:"What would you do differently after reading it?",
 points:["One behavioural change, not five","Anchor it to a specific law","Make it measurable","Admit what you'd struggle with"],
 answer:"Two things. One, I'd audit where my output is chained to my hours and pick a single thing to turn into a system — that's the third directive of the Law of Compensation, the one that's easy to nod at and never do. Two, and this is the one I'd actually find hard, receptivity: saying yes to help, to introductions, to being paid properly. The document treats undercharging as a refusal to receive rather than as modesty, and that reframing was uncomfortable enough to be useful.",
 followUp:"Why is the receiving side harder than the giving side for most people?"},
{id:"cv27",tone:"skeptical",q:"Aren't the Five Laws just repackaged common sense?",
 points:["Concede the familiarity, defend the structure","The value is in the distinctions and the mapping","Common sense isn't commonly applied","Point to a non-obvious claim"],
 answer:"Individually, several of them are familiar — serve people well, be genuine, care about others. What isn't common sense is the structure: that compensation is a product of reach and quality so scale and excellence can't be traded off; that price and value are different dimensions so over-delivering doesn't require discounting; that receiving is a duty rather than a reward; and that each law maps to a specific stage of progression. The mapping section is the least obvious part and the part most people skip. And there's a difference between an idea being familiar and being operationalised — the document turns platitudes into tests.",
 followUp:"Which of those distinctions do you think is genuinely non-obvious?"},
{id:"cv28",tone:"skeptical",q:"Can leverage make organisations less resilient?",
 points:["Yes — concentration risk","The document credits manufacturing with resilience","Its answer to fragility is values, not redundancy","Fair criticism, not a refutation"],
 answer:"I think so, and this is where I'd push back on the document. It grants manufacturing models resilience, reliability and incremental advancement, which is fair-minded. But when it discusses fragility in leveraged businesses, its explanation is entirely about values — speed without values produces volatility. It never addresses the structural version: one system serving millions is a single point of failure in a way that a hundred independent shops aren't. That's a real gap. It doesn't sink the argument, but the framework has no answer to concentration risk.",
 followUp:"So would you add a sixth law? What would it say?"},
{id:"cv29",tone:"friendly",q:"How would you teach this to someone in five minutes?",
 points:["Two halves first","One contrast pair as the anchor","Five laws in one line each","End with the mapping"],
 answer:"I'd start with Blockbuster and Netflix, because it does the whole first half in ten seconds: one grew by adding stores, one built a system, and the difference isn't digital versus physical, it's whether growth needs proportional input. Then I'd say the document's twist is that leverage alone is dangerous — grow without values and you expand fast and collapse fast. Then the five laws, one line each: give more value than you take; income is reach times quality; influence comes from putting others first; nobody can copy you being you; and you have to let value flow back or the cycle stalls. And I'd finish with the mapping, because that's the part that makes it a framework rather than a list — Value gets you survival, Compensation freedom, Influence luxury, Authenticity significance, Receptivity continuity.",
 followUp:"Which of those five lines would a sceptic attack first?"},
{id:"cv30",tone:"hard",q:"Give me the strongest argument against the document's central thesis.",
 points:["Attack the evidence base, not the ideas","Survivorship bias plus unfalsifiability","Values-collapse claim never demonstrated","Then say what survives the attack"],
 answer:"The strongest attack isn't on the ideas, it's on the epistemics. The thesis — that leverage plus values produces durable growth — is illustrated exclusively with companies that already won, so we can't distinguish it from the alternative story where leverage produces growth and the values narrative gets applied afterwards by the winners. Worse, the values-collapse claim, which is the hinge of the whole argument, is never supported with a case; the only failure in the book is Blockbuster, and Blockbuster failed on model, not morals. As stated, it's close to unfalsifiable. What survives is the analytical apparatus: the price/value distinction, the input/output definition of leverage, and reach times quality. Those are useful whether or not the grand claim holds.",
 followUp:"If you were the author, how would you fix that?"},
{id:"cv31",tone:"hard",q:"Pick the weakest of the five laws and defend your choice.",
 points:["Make a real choice","Give the structural reason","Steelman the law before critiquing","Say what would strengthen it"],
 answer:"Authenticity, structurally — not because it's wrong, but because it's the least testable. Value has a mechanism you can check, Compensation is arithmetic, Influence has an observable output in referrals and unrequested opportunity. Authenticity's supporting claim is that people can sense sincerity, which is plausible and largely unmeasurable, and the document's own case for it — the founder who stayed a teacher — is compatible with her simply having a good product. The steelman is the conduit line: personality as the channel value flows through, which reframes it as delivery rather than personality. That's a real idea. It just isn't evidenced.",
 followUp:"Would you drop it, or fix it?"},
{id:"cv32",tone:"hard",q:"How does this framework hold up in an industry where trust doesn't matter much — commodities, say?",
 points:["Take the challenge seriously","The document's answer would be Value plus systems","Concede where reputation is weakly priced","Distinguish B2C from B2B and repeat vs one-shot"],
 answer:"It holds up worst where transactions are one-shot and buyers are indifferent to who they buy from — the document's engine is repeat relationships, referrals and reputation, and in a pure commodity spot market those channels are thin. Its likely answer would be that value can still be delivered through service and reliability rather than product, and that Compensation's systems directive applies regardless of industry. That's fair as far as it goes. But I'd concede the point: the framework is strongest where reputation is priced, and the document doesn't test itself against markets where it isn't.",
 followUp:"So is it a general theory of business, or a theory of relationship businesses?"},
{id:"cv33",tone:"friendly",q:"What's the single line from the document you'd remember?",
 points:["Choose one and explain why it earns its place","Connect it to the structure","Avoid the most generic line","Show it does analytical work"],
 answer:"“Business endures not through transactions, but through transformation.” It sounds like a closing flourish, but it actually summarises the argument: the transactional model is the one where both parties exchange equal value and walk away, and everything the document recommends — over-delivering, scaling reach, building trust — is about producing something that outlives the exchange. The runner-up is more useful in an argument though: without the Five Laws, rapid expansion risks fragility; with them, leverage becomes resilience.",
 followUp:"Is that a claim you could ever test?"},
{id:"cv34",tone:"friendly",q:"If you had to summarise the whole thing in thirty seconds, go.",
 points:["Two halves","Leverage defined mechanically","Five laws named","One consequence line"],
 answer:"Growth used to mean repetition — more staff, more hours, more locations — so output was chained to input. Leverage breaks that chain: systems, networks and technology serve millions without proportional labour, which is Netflix instead of Blockbuster. But the document argues scale alone is dangerous, because companies that grow without values expand fast and collapse fast. So it offers five laws as the operating principles: give more value than you take, income equals reach times quality, influence comes from putting others first, be genuinely yourself, and stay open to receiving. Applied together, they turn leverage into resilience — and profit becomes a byproduct of service rather than its purpose.",
 followUp:"Which sentence of that would you defend hardest if I disagreed with it?"}

{id:"d03",c:"overgiving",title:"Can giving more than you receive encourage exploitation?",
 critique:"“Give more in value than you take in payment” is advice given to individuals, and individuals are usually the weaker party in an employment or client relationship. The same sentence, in an employer's mouth, justifies unpaid overtime and scope creep.",
 response:"The document builds two internal guards. First, the misconception section: “You are not giving away value randomly—you are adding value strategically… This law is not about sacrificing yourself or working for free.” Second, the entire Fifth Law, which frames giving without receiving as imbalance and burnout, and lists undercharging as a symptom of failing to receive. It would argue the framework already forbids the exploitative reading.",
 balanced:"The guards are real and worth citing, but they are psychological rather than structural — they instruct the giver to stay open, not the stronger party to reciprocate. The document is written from the giver's point of view throughout, so it under-examines power asymmetry. My working position: excellent as a personal operating principle, insufficient as a theory of bargaining."},
{id:"d04",c:"law-authenticity",title:"Is authenticity always commercially advantageous?",
 critique:"Authenticity helps when your authentic self happens to be warm, articulate and aligned with your market. For people whose natural style clashes with their industry's expectations, “just be yourself” can be actively costly advice.",
 response:"The document's fourth reason for authenticity partly concedes this: “It attracts the right people. Authenticity repels manipulation and draws those who align with your values.” That is a claim about selection, not universal appeal. It would add the energy argument — pretending is expensive, and “when you're true to yourself, you don't burn out—you burn bright” — and the differentiation argument, that no one else can be you.",
 balanced:"I read the law as a claim about fit rather than charm: authenticity narrows your audience and deepens it. That's defensible, and it is what the document actually says. Where it overreaches is in implying the trade is always favourable — it never discusses the case where the audience you'd attract is too small to sustain the business."},
{id:"d05",c:"leveraging",title:"Can leverage make organisations less resilient?",
 critique:"A system serving millions is a single point of failure. An outage, a security breach, a platform policy change or a regulatory shift can remove the whole business at once, where a hundred independently-owned shops would not fail simultaneously. Leverage concentrates risk as efficiently as it concentrates reach.",
 response:"The document already credits manufacturing models with “resilience, reliability, and incremental advancement,” and it never claims leverage is risk-free. Its account of fragility, though, is values-based: “without values, speed produces volatility rather than resilience,” and with the Five Laws “leverage becomes resilience.” It would argue that trust, loyalty and reputation are precisely what carry a leveraged business through shocks.",
 balanced:"This is the criticism I'd actually raise with the author, because the document's answer addresses a different failure mode than the one being described. Values protect against reputational and short-termist collapse; they do nothing about concentration risk. The framework has no redundancy principle, and it could have one without contradicting anything else in it."},
{id:"d06",c:"laws-leverage-map",title:"Are the Five Laws descriptive principles or motivational philosophy?",
 critique:"They are called laws, but nothing in the document tests them. There are no counter-cases, no measurement, no conditions under which they would be false. That is the structure of a motivational philosophy wearing the vocabulary of economics.",
 response:"The document anticipates the charge directly: “They are not motivational slogans or abstract ideals; they are functional principles that determine whether growth achieved through leverage is sustainable or fragile.” It would point to the genuinely analytical machinery it supplies — price versus value, input versus output, compensation as reach multiplied by quality — and to its insistence that the Second Law is “not merely a moral or philosophical truth; it is an economic one.”",
 balanced:"Both things are true and it's worth saying so. The distinctions are analytical and usable; the grand claims are asserted rather than demonstrated. I'd describe the Five Laws as a decision compass with a genuinely useful mechanical core, and I'd be careful not to call them laws in the empirical sense the word implies."},
{id:"d07",c:"values-guard",title:"Is “grow without values and you collapse” actually demonstrated?",
 critique:"This is the hinge of the entire document — it's what joins the leverage half to the laws half — and it is asserted twice without a single supporting case. The only failure story in the document is Blockbuster, which failed because its growth model was linear, not because it lacked values.",
 response:"The document would say the mechanism is visible in its positive cases: Amazon's reach was built on relentless customer focus, Duolingo's on giving more than it took, the vendor's on trust that attracted investors. It would also point to the modern-economy framing — enterprises confined to old principles face “overworked teams, diminishing margins, and vulnerability to disruption” — and argue values are what convert speed into durability.",
 balanced:"I think this is the document's sharpest structural weakness, and noticing it is a good sign you've read it rather than skimmed it. The claim is plausible and the mechanism is intuitive, but the evidence sits entirely on the success side. I'd still keep the principle — as risk management rather than as a demonstrated law."},
{id:"d08",c:"law-receptivity",title:"Is Receptivity a law, or a caveat dressed as one?",
 critique:"The first four laws describe how value is created, scaled, trusted and differentiated. The fifth describes a personal disposition toward accepting help. It reads like an important footnote to Law 1 rather than an independent principle of enterprise.",
 response:"The document gives it a systemic role rather than a psychological one: it “ties the others together,” it “ensures continuity: abundance is sustained when organizations remain open to the reciprocal flows of opportunity and collaboration,” and refusing to receive is framed as harming the giver — “robbing others of the joy of giving.” Its story is organisational too: the leader's company grew exponentially once she began to accept support.",
 balanced:"I'd argue it earns its place, but as a different kind of principle from the others — the first four are about the flow of value outward, and the fifth is the governor that keeps the flow possible. Notice that even the document's own mapping doesn't give it a rung on the ladder; it gives it continuity. That's an admission that it does a different job, not a weaker one."},
{id:"d09",c:"ex-duolingo",title:"Do the examples prove anything, or were they chosen because they won?",
 critique:"Duolingo, Netflix, Amazon, Starbucks and Facebook are all enormous successes selected after the fact. We never see the company that gave extraordinary value and failed, or the leveraged business with excellent values that went under. Selecting on the outcome makes any principle look predictive.",
 response:"The document would note that Blockbuster is a failure case included precisely to show the contrast, and that its argument rests on mechanism rather than only on outcome — the input/output relationship, the systems that keep producing value after effort stops, the two-term compensation equation. It would also say the illustrations are meant as demonstrations of a principle, not as a dataset.",
 balanced:"Survivorship bias is a fair charge and I'd concede it directly. The defence I'd actually make is that the mechanisms are separable from the anecdotes: you can test whether your own growth requires proportional input without believing anything about Duolingo. The examples teach the idea; they don't establish it."}
];
